<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCrush - Z-Connect</title>

<!-- Lucide Icons: Load BEFORE JavaScript -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* =====================================
   ZCRUSH DARK THEME
===================================== */

:root{
  color-scheme:dark;

  --bg:#08070b;
  --card:#121016;
  --text:#ffffff;
  --muted:#a8a2b0;
  --border:#292431;
  --purple:#241638;
  --accent:#b77aff;
  --post:#211d27;
  --button:#302b36;
  --shadow:0 5px 20px #0003;
}

/* =====================================
   ZCRUSH LIGHT THEME
===================================== */

body.light{
  color-scheme:light;

  --bg:#f5f4f8;
  --card:#ffffff;
  --text:#211b2a;
  --muted:#777080;
  --border:#e7e1ec;
  --purple:#eee5f8;
  --accent:#8142b7;
  --post:#f0edf3;
  --button:#eae5ef;
  --shadow:0 5px 20px #0000000b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .2s,color .2s;
}

/* TOPBAR */

.topbar{
  height:70px;
  width:100%;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:var(--purple);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
  color:var(--text);
  text-decoration:none;
}

.logo-z{
  color:#ff3030;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:17px;
}

.search-box{
  width:250px;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:22px;
  outline:none;
  background:var(--card);
  color:var(--text);
}

.top-icon{
  background:none;
  border:0;
  color:var(--text);
  cursor:pointer;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-icon i{
  width:22px;
  height:22px;
  stroke-width:1.8;
}

/* SIDEBAR */

.sidebar{
  width:230px;
  position:fixed;
  top:70px;
  bottom:0;
  left:0;
  padding:25px 15px;
  background:var(--bg);
  border-right:1px solid var(--border);
  z-index:500;
}

.menu-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  margin:5px 12px 20px;
}

.nav-link{
  display:flex;
  align-items:center;
  gap:15px;
  padding:13px 14px;
  margin-bottom:7px;
  border-radius:12px;
  color:var(--text);
  text-decoration:none;
  font-size:15px;
}

.nav-link:hover,
.nav-link.active{
  background:var(--purple);
  color:var(--accent);
}

.nav-icon{
  width:23px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-icon i{
  width:20px;
  height:20px;
  stroke-width:1.8;
}

/* MAIN CHAT CONTAINER */

.main{
  margin-left:230px;
  width:calc(100% - 230px);
  height:calc(100vh - 70px);
  padding:20px;
  display:flex;
  gap:20px;
}

.chat-wrapper{
  width:100%;
  height:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  display:flex;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}

/* CHATS LIST (LEFT SIDE) */

.chat-sidebar{
  width:320px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:var(--card);
}

.chat-search-container{
  padding:15px;
  border-bottom:1px solid var(--border);
}

.chat-search{
  width:100%;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--bg);
  color:var(--text);
  outline:none;
  font-size:13px;
}

.chat-list{
  flex:1;
  overflow-y:auto;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .2s;
}

.chat-item:hover,
.chat-item.active{
  background:var(--purple);
}

.chat-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  flex-shrink:0;
  overflow:hidden;
}

.chat-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chat-info{
  flex:1;
  overflow:hidden;
}

.chat-name-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}

.chat-name{
  font-size:14px;
  font-weight:700;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-time{
  font-size:11px;
  color:var(--muted);
}

.chat-preview{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* CHAT WINDOW (RIGHT SIDE) */

.chat-main{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

.chat-header{
  height:65px;
  padding:0 20px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-header-user{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  background:none;
  border:0;
  color:var(--text);
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  padding:4px;
  margin-right:4px;
}

.chat-messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message-bubble{
  max-width:65%;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
  position:relative;
}

.message-bubble.incoming{
  align-self:flex-start;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  border-bottom-left-radius:4px;
}

.message-bubble.outgoing{
  align-self:flex-end;
  background:var(--accent);
  color:white;
  border-bottom-right-radius:4px;
}

.message-img{
  max-width:100%;
  border-radius:10px;
  margin-top:6px;
  display:block;
}

.message-time{
  font-size:10px;
  opacity:0.7;
  margin-top:4px;
  text-align:right;
}

/* CHAT INPUT AREA */

.chat-input-area{
  padding:15px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-input{
  flex:1;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--bg);
  color:var(--text);
  outline:none;
  font-size:14px;
}

.send-btn{
  background:var(--accent);
  color:white;
  border:0;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}

.icon-btn{
  background:none;
  border:0;
  color:var(--muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* NOTIFICATIONS & TOAST */

.notification-panel{
  display:none;
  position:fixed;
  top:76px;
  right:15px;
  width:min(350px,92vw);
  max-height:65vh;
  overflow-y:auto;
  padding:16px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:15px;
  z-index:3000;
  box-shadow:var(--shadow);
}

.toast{
  display:none;
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:#30233b;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  z-index:5000;
  max-width:90%;
  text-align:center;
  font-size:14px;
}

/* MOBILE NAV */

.bottom-nav{
  display:none;
}

/* RESPONSIVE FULL-SCREEN MOBILE CHAT SWITCHING */

@media(max-width:800px){

  .topbar{
    height:65px;
    padding:0 14px;
  }

  .logo{
    font-size:27px;
  }

  .top-actions{
    gap:12px;
  }

  .search-box{
    width:125px;
    padding:8px 10px;
  }

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
    height:calc(100vh - 65px - 76px);
    padding:0;
  }

  .chat-wrapper{
    border-radius:0;
    border:0;
  }

  .chat-sidebar{
    width:100%;
    height:100%;
  }

  .chat-sidebar.hide-mobile{
    display:none !important;
  }

  .chat-main{
    display:none;
    width:100%;
    height:100%;
    position:absolute;
    top:0;
    left:0;
    z-index:10;
    background:var(--bg);
  }

  .chat-main.show-mobile{
    display:flex !important;
  }

  .back-btn{
    display:flex !important;
  }

  .message-bubble{
    max-width:82%;
  }

  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:76px;
    background:var(--purple);
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-top:1px solid var(--border);
    z-index:2000;
  }

  .bottom-link{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
  }

  .bottom-link i{
    width:28px;
    height:28px;
    stroke-width:1.9;
  }

  .bottom-link.active{
    color:var(--accent);
    font-weight:700;
  }

  .bottom-link.active i{
    color:var(--accent);
  }
}

</style>
</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

  <a href="index.html" class="logo">
    <span class="logo-z">Z</span>Crush
  </a>

  <div class="top-actions">

    <input
      type="search"
      id="searchInput"
      class="search-box"
      placeholder="Search..."
    >

    <button class="top-icon" id="notificationBtn" title="Notifications">
      <i data-lucide="bell"></i>
    </button>

    <button class="top-icon" id="connectBtn" title="Z-Connect">
      <i data-lucide="globe"></i>
    </button>

  </div>

</header>


<!-- DESKTOP SIDEBAR -->

<aside class="sidebar">

  <div class="menu-title">MENU</div>

  <a href="index.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="house"></i></span> Home
  </a>

  <a href="moments.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="sparkles"></i></span> Moments
  </a>

  <a href="shorts.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="circle-play"></i></span> Shorts
  </a>

  <a href="message.html" class="nav-link active">
    <span class="nav-icon"><i data-lucide="globe"></i></span> Z-Connect
  </a>

  <a href="profile.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="user-round"></i></span> Profile
  </a>

</aside>


<!-- MAIN CHAT CONTENT -->

<main class="main">

  <div class="chat-wrapper">

    <!-- LEFT SIDEBAR: CHAT LIST -->
    <div class="chat-sidebar" id="chatSidebar">
      <div class="chat-search-container">
        <input type="text" class="chat-search" id="chatSearch" placeholder="Search Z-Connect chats..." oninput="filterChatList()">
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- RIGHT WINDOW: CHAT MESSAGES -->
    <div class="chat-main" id="chatMain">
      <div class="chat-header">
        <div class="chat-header-user">
          <button class="back-btn" id="backToListBtn" onclick="showChatListMobile()" title="Back to Chats">
            <i data-lucide="arrow-left"></i>
          </button>
          <div class="chat-avatar" id="activeChatAvatar">A</div>
          <div>
            <div style="font-weight:bold; font-size:15px;" id="activeChatName">Select a chat</div>
            <div style="font-size:11px; color:var(--muted);" id="activeChatStatus">Online</div>
          </div>
        </div>

        <button class="icon-btn" title="Chat Options">
          <i data-lucide="ellipsis-vertical"></i>
        </button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div style="text-align:center; color:var(--muted); margin:auto;">
          Select a user to start Z-Connect messaging
        </div>
      </div>

      <div class="chat-input-area">
        <label class="icon-btn" title="Send Media">
          <i data-lucide="image"></i>
          <input type="file" id="mediaInput" accept="image/*" style="display:none;" onchange="sendMediaMessage(this)">
        </label>
        <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
          <i data-lucide="send" style="width:18px; height:18px;"></i>
        </button>
      </div>
    </div>

  </div>

</main>


<!-- NOTIFICATIONS PANEL -->
<div class="notification-panel" id="notificationPanel"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<!-- MOBILE BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="index.html" class="bottom-link">
    <i data-lucide="house"></i>
    <span>Home</span>
  </a>

  <a href="moments.html" class="bottom-link">
    <i data-lucide="sparkles"></i>
    <span>Moments</span>
  </a>

  <a href="zcam.html" class="bottom-link">
    <i data-lucide="aperture"></i>
    <span>ZCam</span>
  </a>

  <a href="shorts.html" class="bottom-link">
    <i data-lucide="circle-play"></i>
    <span>Shorts</span>
  </a>

  <a href="profile.html" class="bottom-link">
    <i data-lucide="user-round"></i>
    <span>Profile</span>
  </a>

</nav>


<script>
const $ = id => document.getElementById(id);

// Dummy Chat Contacts
let contacts = [
  { id: "user_1", name: "Alex Rivers", avatar: "", unread: 2 },
  { id: "user_2", name: "Sophia Chen", avatar: "", unread: 0 },
  { id: "user_3", name: "Marcus Vance", avatar: "", unread: 0 }
];

let activeUserId = null;

function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(()=>t.style.display="none", 2500);
}

function getMessages(userId){
  const allData = JSON.parse(localStorage.getItem("zcrushMessages") || "{}");
  return allData[userId] || [
    { sender: userId, text: "Hey! Welcome to Z-Connect.", time: "10:30 AM" }
  ];
}

function saveMessages(userId, msgs){
  const allData = JSON.parse(localStorage.getItem("zcrushMessages") || "{}");
  allData[userId] = msgs;
  localStorage.setItem("zcrushMessages", JSON.stringify(allData));
}

function renderChatList(){
  const list = $("chatList");
  list.innerHTML = "";

  contacts.forEach(c => {
    const msgs = getMessages(c.id);
    const lastMsg = msgs.length ? msgs[msgs.length - 1] : { text: "No messages yet", time: "" };

    const item = document.createElement("div");
    item.className = `chat-item ${c.id === activeUserId ? "active" : ""}`;
    item.onclick = () => selectChat(c.id);

    item.innerHTML = `
      <div class="chat-avatar">${c.avatar ? `<img src="${c.avatar}">` : c.name.charAt(0)}</div>
      <div class="chat-info">
        <div class="chat-name-row">
          <div class="chat-name">${c.name}</div>
          <div class="chat-time">${lastMsg.time || ""}</div>
        </div>
        <div class="chat-preview">${lastMsg.image ? "📷 Photo" : lastMsg.text}</div>
      </div>
    `;

    list.appendChild(item);
  });
}

function filterChatList(){
  const query = $("chatSearch").value.toLowerCase();
  const items = document.querySelectorAll(".chat-item");
  contacts.forEach((c, index) => {
    const match = c.name.toLowerCase().includes(query);
    if(items[index]) items[index].style.display = match ? "flex" : "none";
  });
}

function selectChat(userId){
  activeUserId = userId;
  const user = contacts.find(c => c.id === userId);

  $("activeChatName").textContent = user.name;
  $("activeChatAvatar").innerHTML = user.avatar ? `<img src="${user.avatar}">` : user.name.charAt(0);

  if(window.innerWidth <= 800){
    $("chatSidebar").classList.add("hide-mobile");
    $("chatMain").classList.add("show-mobile");
  }

  renderChatList();
  renderMessages();
}

function showChatListMobile(){
  $("chatSidebar").classList.remove("hide-mobile");
  $("chatMain").classList.remove("show-mobile");
}

function renderMessages(){
  if(!activeUserId) return;
  const msgs = getMessages(activeUserId);
  const container = $("chatMessages");
  container.innerHTML = "";

  msgs.forEach(m => {
    const bubble = document.createElement("div");
    const isOutgoing = m.sender === "me";
    bubble.className = `message-bubble ${isOutgoing ? "outgoing" : "incoming"}`;

    let content = m.text ? `<div>${m.text}</div>` : "";
    if(m.image){
      content += `<img src="${m.image}" class="message-img" alt="Media">`;
    }
    content += `<div class="message-time">${m.time}</div>`;

    bubble.innerHTML = content;
    container.appendChild(bubble);
  });

  container.scrollTop = container.scrollHeight;
}

function sendMessage(){
  const text = $("messageInput").value.trim();
  if(!text || !activeUserId) return;

  const msgs = getMessages(activeUserId);
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  msgs.push({ sender: "me", text: text, time: timeStr });
  saveMessages(activeUserId, msgs);

  $("messageInput").value = "";
  renderMessages();
  renderChatList();
}

function sendMediaMessage(input){
  const file = input.files[0];
  if(!file || !activeUserId) return;

  const reader = new FileReader();
  reader.onload = function(e){
    const msgs = getMessages(activeUserId);
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    msgs.push({ sender: "me", image: e.target.result, time: timeStr });
    saveMessages(activeUserId, msgs);

    renderMessages();
    renderChatList();
    showToast("Photo sent!");
  };
  reader.readAsDataURL(file);
}

function handleKeyPress(e){
  if(e.key === "Enter") sendMessage();
}

/* AUTOMATIC DEVICE THEME */
const deviceTheme = window.matchMedia("(prefers-color-scheme: dark)");
function applyDeviceTheme(){
  document.body.classList.toggle("light", !deviceTheme.matches);
}
applyDeviceTheme();
if(deviceTheme.addEventListener){
  deviceTheme.addEventListener("change", applyDeviceTheme);
}

renderChatList();
if(window.innerWidth > 800 && contacts.length > 0){
  selectChat(contacts[0].id);
}

if(window.lucide) lucide.createIcons();
</script>
</body>
</html>
