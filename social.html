<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCrush - Social</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#151827;
  min-height:100vh;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  height:65px;
  background:white;
  border-bottom:1px solid #e5e7ef;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:25px;
  font-weight:bold;
  background:linear-gradient(90deg,#9b00ff,#ff22bd,#168cff);
  -webkit-background-clip:text;
  color:transparent;
}

.topSearch{
  width:280px;
  background:#f1f3f8;
  border:none;
  outline:none;
  padding:11px 16px;
  border-radius:22px;
  color:#333;
}

.topSearch::placeholder{
  color:#999;
}

.topRight{
  display:flex;
  align-items:center;
  gap:18px;
}

.notification{
  font-size:18px;
  cursor:pointer;
}

.topAvatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

/* =========================
   LAYOUT
========================= */

.layout{
  display:flex;
  max-width:1250px;
  margin:auto;
  min-height:calc(100vh - 65px);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:220px;
  background:white;
  border-right:1px solid #e5e7ef;
  padding:25px 15px;
  position:sticky;
  top:65px;
  height:calc(100vh - 65px);
}

.sidebar a{
  display:block;
  text-decoration:none;
  color:#555b6d;
  padding:13px 15px;
  border-radius:10px;
  margin-bottom:6px;
  font-size:14px;
}

.sidebar a:hover{
  background:#f5f0ff;
  color:#721cff;
}

.sidebar a.active{
  background:#eee3ff;
  color:#721cff;
  font-weight:bold;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  padding:25px;
  max-width:1000px;
  min-width:0;
}

/* =========================
   PAGE HEADER
========================= */

.pageHeader{
  background:white;
  border:1px solid #e5e7ef;
  border-radius:15px;
  padding:22px 25px;
  margin-bottom:20px;
}

.pageHeader h1{
  font-size:26px;
  margin-bottom:7px;
}

.gradient{
  background:linear-gradient(
    90deg,
    #9b00ff,
    #ff22bd,
    #168cff
  );
  -webkit-background-clip:text;
  color:transparent;
}

.pageHeader p{
  color:#777;
  font-size:14px;
}

/* =========================
   CREATE POST
========================= */

.createBox{
  background:white;
  border:1px solid #e5e7ef;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

.userTop{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#e9ebf2;
}

.userName{
  font-weight:bold;
  color:#222;
}

.handle{
  color:#888;
  font-size:13px;
  margin-top:3px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:none;
  background:#f8f9fc;
  color:#222;
  border:1px solid #e0e3eb;
  border-radius:12px;
  padding:14px;
  outline:none;
  font-size:15px;
}

textarea:focus{
  border-color:#9b55ff;
  background:white;
}

textarea::placeholder{
  color:#999;
}

.createActions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  gap:10px;
}

.fileBtn{
  color:#666;
  cursor:pointer;
  font-size:14px;
  padding:9px 12px;
  border-radius:9px;
}

.fileBtn:hover{
  background:#f3f0fa;
  color:#721cff;
}

#imageInput{
  display:none;
}

.preview{
  margin-top:12px;
  display:none;
}

.preview img{
  max-width:100%;
  max-height:350px;
  border-radius:12px;
}

.postBtn{
  border:none;
  color:white;
  padding:10px 22px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(
    90deg,
    #721cff,
    #a000ff
  );
}

.postBtn:hover{
  opacity:.9;
}

/* =========================
   SEARCH
========================= */

.feedSearch{
  margin-bottom:20px;
}

.feedSearch input{
  width:100%;
  background:white;
  border:1px solid #e5e7ef;
  color:#333;
  padding:13px 16px;
  border-radius:12px;
  outline:none;
}

.feedSearch input:focus{
  border-color:#9b55ff;
}

/* =========================
   POSTS
========================= */

.post{
  background:white;
  border:1px solid #e5e7ef;
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

.postHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.postUser{
  display:flex;
  align-items:center;
  gap:10px;
}

.followBtn{
  border:1px solid #721cff;
  background:white;
  color:#721cff;
  padding:7px 14px;
  border-radius:18px;
  cursor:pointer;
  font-size:12px;
}

.followBtn:hover{
  background:#f1e9ff;
}

.followBtn.following{
  background:#721cff;
  color:white;
}

.postText{
  margin:15px 0;
  color:#444;
  line-height:1.6;
  white-space:pre-wrap;
  font-size:15px;
}

.postImage{
  width:100%;
  max-height:550px;
  object-fit:cover;
  border-radius:12px;
  margin-top:8px;
  display:block;
}

.postActions{
  display:flex;
  gap:22px;
  border-top:1px solid #eee;
  padding-top:13px;
  margin-top:15px;
}

.actionBtn{
  border:none;
  background:none;
  color:#777;
  cursor:pointer;
  font-size:14px;
}

.actionBtn:hover{
  color:#721cff;
}

.actionBtn.liked{
  color:#ff3b7f;
}

.deleteBtn{
  color:#ef4056 !important;
  border-color:#ef4056 !important;
  background:white !important;
}

/* =========================
   COMMENTS
========================= */

.comments{
  margin-top:15px;
  display:none;
}

.commentList{
  margin-bottom:10px;
}

.comment{
  background:#f5f6fa;
  padding:10px 12px;
  border-radius:10px;
  margin-bottom:7px;
  font-size:13px;
  color:#444;
}

.comment strong{
  color:#222;
  display:block;
  margin-bottom:3px;
}

.commentInput{
  display:flex;
  gap:8px;
}

.commentInput input{
  flex:1;
  background:#f8f9fc;
  border:1px solid #e0e3eb;
  color:#333;
  border-radius:10px;
  padding:10px;
  outline:none;
}

.commentInput input:focus{
  border-color:#9b55ff;
}

.commentInput button{
  border:none;
  background:#721cff;
  color:white;
  border-radius:10px;
  padding:0 15px;
  cursor:pointer;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  color:#777;
  padding:35px;
  background:white;
  border:1px solid #e5e7ef;
  border-radius:15px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  display:none;
  z-index:9999;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  color:#888;
  padding:30px 0;
  font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    width:180px;
  }

  .topSearch{
    width:200px;
  }

  .main{
    padding:18px;
  }

}

@media(max-width:600px){

  .topbar{
    padding:0 15px;
  }

  .topSearch{
    display:none;
  }

  .sidebar{
    width:70px;
    padding:15px 8px;
  }

  .sidebar a{
    font-size:0;
    text-align:center;
    padding:13px 5px;
  }

  .sidebar a::first-letter{
    font-size:18px;
  }

  .main{
    padding:12px;
  }

  .pageHeader{
    padding:18px;
  }

  .pageHeader h1{
    font-size:22px;
  }

  .createActions{
    flex-direction:column;
    align-items:stretch;
  }

  .postBtn{
    width:100%;
  }

  .postHeader{
    align-items:flex-start;
  }

  .followBtn{
    padding:6px 10px;
  }

}

@media(max-width:400px){

  .sidebar{
    width:58px;
  }

  .topbar{
    height:58px;
  }

  .main{
    padding:10px;
  }

  .post{
    padding:14px;
  }

}
</style>
</head>

<body>

<!-- =========================
     TOPBAR
========================= -->

<header class="topbar">

  <div class="logo">
    ZCrush
  </div>

  <input
    class="topSearch"
    placeholder="Search ZCrush"
  >

  <div class="topRight">

    <div class="notificationWrap">

  <button
    class="notification"
    onclick="toggleNotifications()"
  >
    🔔
    <span id="notificationBadge" class="notificationBadge">
      0
    </span>
  </button>

  <div
    id="notificationPanel"
    class="notificationPanel"
  >

    <div class="notificationHeader">
      <strong>Notifications</strong>

      <button onclick="markAllNotificationsRead()">
        Mark all read
      </button>
    </div>

    <div id="notificationList"></div>

  </div>

</div>

    <img
      id="topAvatar"
      class="topAvatar"
      src=""
      alt="Profile"
    >

  </div>

</header>


<!-- =========================
     LAYOUT
========================= -->

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <a href="index.html">
      🏠 Home
    </a>

    <a
      href="social.html"
      class="active"
    >
      👥 Social
    </a>

    <a href="gaming.html">
      🎮 Gaming
    </a>

    <a href="shorts.html">
      🎬 Shorts
    </a>

    <a href="marketplace.html">
      🛒 Marketplace
    </a>

    <a href="profile.html">
      👤 Profile
    </a>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <!-- PAGE HEADER -->

    <section class="pageHeader">

      <h1>
        <span class="gradient">
          ZCrush Social
        </span>
      </h1>

      <p>
        Connect • Share • Like • Comment • Follow
      </p>

    </section>


    <!-- CREATE POST -->

    <div class="createBox">

      <div class="userTop">

        <img
          id="currentAvatar"
          class="avatar"
          src=""
          alt="Profile"
        >

        <div>

          <div
            class="userName"
            id="currentName"
          >
            ZCrush User
          </div>

          <div
            class="handle"
            id="currentHandle"
          >
            @zcrushuser
          </div>

        </div>

      </div>


      <textarea
        id="postText"
        placeholder="What's happening on ZCrush?"
      ></textarea>


      <div
        class="preview"
        id="preview"
      >

        <img
          id="previewImg"
          src=""
          alt="Preview"
        >

      </div>


      <div class="createActions">

        <label class="fileBtn">

          📷 Add Photo

          <input
            type="file"
            id="imageInput"
            accept="image/*"
          >

        </label>


        <button
          class="postBtn"
          onclick="createPost()"
        >
          Post
        </button>

      </div>

    </div>


    <!-- FEED SEARCH -->

    <div class="feedSearch">

      <input
        type="text"
        id="searchInput"
        placeholder="Search posts or users..."
        oninput="renderPosts()"
      >

    </div>


    <!-- FEED -->

    <div id="feed"></div>

  </main>

</div>


<footer>
  © 2026 ZCrush • Connect. Create. Explore.
</footer>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================
   LOGIN PROTECTION
========================= */

if(
  localStorage.getItem("zcrushLoggedIn")
  !== "true"
){

  alert("Please login to use ZCrush Social.");

  window.location.href="login.html";

}


/* =========================
   CURRENT USER
========================= */

const currentUser={

  name:
    localStorage.getItem("zcrushUserName")
    || "ZCrush User",

  handle:
    localStorage.getItem("zcrushUserHandle")
    || "@zcrushuser",

  photo:
    localStorage.getItem("zcrushProfilePhoto")
    || ""

};


document.getElementById("currentName")
.textContent=currentUser.name;


document.getElementById("currentHandle")
.textContent=currentUser.handle;


const currentAvatar=
  document.getElementById("currentAvatar");


const topAvatar=
  document.getElementById("topAvatar");


if(currentUser.photo){

  currentAvatar.src=
    currentUser.photo;

  topAvatar.src=
    currentUser.photo;

}else{

  currentAvatar.src=
    "https://via.placeholder.com/100/721cff/ffffff?text=Z";

  topAvatar.src=
    "https://via.placeholder.com/100/721cff/ffffff?text=Z";

}


/* =========================
   STORAGE
========================= */

function getPosts(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem("zcrushPosts")
        || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    return [];

  }

}


function savePosts(posts){

  try{

    localStorage.setItem(
      "zcrushPosts",
      JSON.stringify(posts)
    );

    return true;

  }catch(e){

    showToast(
      "Storage full. Please remove some images."
    );

    return false;

  }

}


/* =========================
   FOLLOW
========================= */

function getFollowing(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem("zcrushFollowing")
        || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    return [];

  }

}


function saveFollowing(list){

  localStorage.setItem(
    "zcrushFollowing",
    JSON.stringify(list)
  );

}


/* =========================
   DEFAULT POSTS
========================= */

const defaultPosts=[

  {
    id:"default_1",

    name:"ZCrush Official",

    handle:"@zcrush",

    photo:"",

    text:
      "Welcome to ZCrush! 🚀 Create, connect and explore everything in one place.",

    image:
      "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=80"
  },

  {
    id:"default_2",

    name:"ZCrush Gaming",

    handle:"@zcrushgaming",

    photo:"",

    text:
      "Gaming on ZCrush 🎮 Who is ready for the next level?",

    image:
      "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80"
  },

  {
    id:"default_3",

    name:"ZCrush Creator",

    handle:"@creator",

    photo:"",

    text:
      "Share your creativity with the ZCrush community ✨",

    image:
      "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80"
  }

];


/* =========================
   DEFAULT DATA
========================= */

function getDefaultData(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem("zcrushDefaultPosts")
        || "{}"
      );

    return data &&
      typeof data==="object"
      ? data
      : {};

  }catch(e){

    return {};

  }

}


function saveDefaultData(data){

  localStorage.setItem(
    "zcrushDefaultPosts",
    JSON.stringify(data)
  );

}


/* =========================
   IMAGE UPLOAD
========================= */

let selectedImage="";


document.getElementById("imageInput")
.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file) return;


    if(!file.type.startsWith("image/")){

      showToast(
        "Please select an image."
      );

      return;

    }


    const reader=
      new FileReader();


    reader.onload=function(e){

      const img=
        new Image();


      img.onload=function(){

        const maxWidth=1200;

        let width=img.width;

        let height=img.height;


        if(width>maxWidth){

          height=
            Math.round(
              height*(maxWidth/width)
            );

          width=maxWidth;

        }


        const canvas=
          document.createElement("canvas");


        canvas.width=width;

        canvas.height=height;


        const ctx=
          canvas.getContext("2d");


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        selectedImage=
          canvas.toDataURL(
            "image/jpeg",
            0.82
          );


        document.getElementById(
          "previewImg"
        ).src=selectedImage;


        document.getElementById(
          "preview"
        ).style.display="block";

      };


      img.src=e.target.result;

    };


    reader.readAsDataURL(file);

  }
);


/* =========================
   CREATE POST
========================= */

function createPost(){

  const text=
    document.getElementById("postText")
    .value
    .trim();


  if(!text && !selectedImage){

    showToast(
      "Write something or add a photo."
    );

    return;

  }


  const posts=
    getPosts();


  const newPost={

    id:
      "user_"+Date.now(),

    name:
      currentUser.name,

    handle:
      currentUser.handle,

    photo:
      currentUser.photo,

    text:
      text,

    image:
      selectedImage,

    liked:false,

    likes:0,

    comments:[],

    createdAt:
      Date.now(),

    owner:
      currentUser.handle

  };


  posts.unshift(newPost);


  if(!savePosts(posts))
    return;


  document.getElementById(
    "postText"
  ).value="";


  document.getElementById(
    "imageInput"
  ).value="";


  document.getElementById(
    "preview"
  ).style.display="none";


  selectedImage="";


  renderPosts();


  showToast(
    "Post published successfully! 🎉"
  );

}


/* =========================
   LIKE USER POST
========================= */

function likeUserPost(id){

  const posts=
    getPosts();


  const post=
    posts.find(
      p=>p.id===id
    );


  if(!post)
    return;


  post.likes=
    Number(post.likes || 0);


  if(post.liked){

    post.likes--;

  }else{

    post.likes++;

  }


  post.liked=
    !post.liked;


  savePosts(posts);

  renderPosts();

}


/* =========================
   LIKE DEFAULT POST
========================= */

function likeDefaultPost(id){

  const data=
    getDefaultData();


  if(!data[id]){

    data[id]={

      liked:false,

      likes:0,

      comments:[]

    };

  }


  if(data[id].liked){

    data[id].likes--;

  }else{

    data[id].likes++;

  }


  data[id].liked=
    !data[id].liked;


  saveDefaultData(data);

  renderPosts();

}


/* =========================
   FOLLOW
========================= */

function toggleFollow(handle){

  if(
    handle===currentUser.handle
  ){

    showToast(
      "You cannot follow yourself."
    );

    return;

  }


  const following=
    getFollowing();


  const index=
    following.indexOf(handle);


  if(index===-1){

    following.push(handle);

    showToast(
      "Following "+handle+" ✓"
    );

  }else{

    following.splice(
      index,
      1
    );

    showToast(
      "Unfollowed "+handle
    );

  }


  saveFollowing(following);

  renderPosts();

}


/* =========================
   COMMENTS
========================= */

function toggleComments(id){

  const box=
    document.getElementById(
      "comments_"+id
    );


  if(!box)
    return;


  box.style.display=
    box.style.display==="block"
      ? "none"
      : "block";

}


function addUserComment(id){

  const input=
    document.getElementById(
      "commentInput_"+id
    );


  const text=
    input.value.trim();


  if(!text)
    return;


  const posts=
    getPosts();


  const post=
    posts.find(
      p=>p.id===id
    );


  if(!post)
    return;


  if(!Array.isArray(post.comments)){

    post.comments=[];

  }


  post.comments.push({

    name:
      currentUser.name,

    handle:
      currentUser.handle,

    text:
      text,

    time:
      Date.now()

  });


  savePosts(posts);


  input.value="";


  renderPosts();


  setTimeout(function(){

    const box=
      document.getElementById(
        "comments_"+id
      );

    if(box)
      box.style.display="block";

  },20);

}


function addDefaultComment(id){

  const input=
    document.getElementById(
      "commentInput_"+id
    );


  const text=
    input.value.trim();


  if(!text)
    return;


  const data=
    getDefaultData();


  if(!data[id]){

    data[id]={

      liked:false,

      likes:0,

      comments:[]

    };

  }


  if(!Array.isArray(
    data[id].comments
  )){

    data[id].comments=[];

  }


  data[id].comments.push({

    name:
      currentUser.name,

    handle:
      currentUser.handle,

    text:
      text,

    time:
      Date.now()

  });


  saveDefaultData(data);


  input.value="";


  renderPosts();


  setTimeout(function(){

    const box=
      document.getElementById(
        "comments_"+id
      );

    if(box)
      box.style.display="block";

  },20);

}


/* =========================
   DELETE
========================= */

function deletePost(id){

  if(
    !confirm("Delete this post?")
  ){

    return;

  }


  let posts=
    getPosts();


  posts=
    posts.filter(
      p=>p.id!==id
    );


  savePosts(posts);

  renderPosts();


  showToast(
    "Post deleted."
  );

}


/* =========================
   SHARE
========================= */

async function sharePost(id){

  const shareData={

    title:"ZCrush",

    text:
      "Check this post on ZCrush!",

    url:
      window.location.href

  };


  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      showToast(
        "Link copied!"
      );

    }

  }catch(e){}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(str){

  if(
    str===undefined ||
    str===null
  )
    return "";


  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   AVATAR
========================= */

function avatarHTML(
  photo,
  name
){

  if(photo){

    return `

      <img
        class="avatar"
        src="${escapeHTML(photo)}"
        alt="Profile"
      >

    `;

  }


  return `

    <div
      class="avatar"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        background:#721cff;
        font-weight:bold;
      "
    >

      ${escapeHTML(
        (name || "Z")
        .charAt(0)
        .toUpperCase()
      )}

    </div>

  `;

}


/* =========================
   COMMENTS HTML
========================= */

function commentsHTML(comments){

  if(
    !Array.isArray(comments) ||
    comments.length===0
  ){

    return `

      <div
        class="empty"
        style="
          padding:10px 0;
          font-size:13px;
          border:none;
        "
      >
        No comments yet.
      </div>

    `;

  }


  return comments.map(
    function(c){

      return `

        <div class="comment">

          <strong>
            ${escapeHTML(c.name)}
          </strong>

          <div>
            ${escapeHTML(c.text)}
          </div>

        </div>

      `;

    }
  ).join("");

}


/* =========================
   USER POST
========================= */

function renderUserPost(
  post,
  following
){

  const liked=
    post.liked===true;


  const comments=
    Array.isArray(post.comments)
      ? post.comments
      : [];


  const isFollowing=
    following.includes(
      post.handle
    );


  return `

    <article class="post">

      <div class="postHeader">

        <div class="postUser">

          ${avatarHTML(
            post.photo,
            post.name
          )}

          <div>

            <div class="userName">
              ${escapeHTML(
                post.name
              )}
            </div>

            <div class="handle">
              ${escapeHTML(
                post.handle
              )}
            </div>

          </div>

        </div>


        <div>

          ${
            post.handle!==currentUser.handle

            ? `

              <button
                class="followBtn ${
                  isFollowing
                    ? "following"
                    : ""
                }"
                onclick="
                  toggleFollow(
                    '${escapeAttribute(
                      post.handle
                    )}'
                  )
                "
              >

                ${
                  isFollowing
                    ? "Following"
                    : "Follow"
                }

              </button>

            `

            : `

              <button
                class="followBtn deleteBtn"
                onclick="
                  deletePost(
                    '${escapeAttribute(
                      post.id
                    )}'
                  )
                "
              >
                Delete
              </button>

            `
          }

        </div>

      </div>


      ${
        post.text

        ? `

          <div class="postText">

            ${escapeHTML(
              post.text
            )}

          </div>

        `

        : ""
      }


      ${
        post.image

        ? `

          <img
            class="postImage"
            src="${escapeHTML(
              post.image
            )}"
            alt="Post image"
          >

        `

        : ""
      }


      <div class="postActions">

        <button
          class="actionBtn ${
            liked
              ? "liked"
              : ""
          }"
          onclick="
            likeUserPost(
              '${escapeAttribute(
                post.id
              )}'
            )
          "
        >

          ${
            liked
              ? "❤️"
              : "♡"
          }

          ${post.likes || 0}

        </button>


        <button
          class="actionBtn"
          onclick="
            toggleComments(
              '${escapeAttribute(
                post.id
              )}'
            )
          "
        >

          💬 ${comments.length}

        </button>


        <button
          class="actionBtn"
          onclick="
            sharePost(
              '${escapeAttribute(
                post.id
              )}'
            )
          "
        >

          ↗ Share

        </button>

      </div>


      <div
        class="comments"
        id="comments_${escapeAttribute(
          post.id
        )}"
      >

        <div class="commentList">

          ${commentsHTML(
            comments
          )}

        </div>


        <div class="commentInput">

          <input
            id="commentInput_${escapeAttribute(
              post.id
            )}"
            placeholder="Write a comment..."
          >

          <button
            onclick="

                '${escapeAttribute(
                  post.id

              )
            "

/* =========================
   RENDER FEED
========================= */

function renderPosts(){

  const feed=
    document.getElementById(
      "feed"
    );


  const query=
    document.getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


  const userPosts=
    getPosts();


  const defaultData=
    getDefaultData();


  const following=
    getFollowing();


  let allPosts=[

    ...userPosts,

    ...defaultPosts

  ];


  if(query){

    allPosts=
      allPosts.filter(
        function(post){

          return (

            String(
              post.name || ""
            )
            .toLowerCase()
            .includes(query)

            ||

            String(
              post.handle || ""
            )
            .toLowerCase()
            .includes(query)

            ||

            String(
              post.text || ""
            )
            .toLowerCase()
            .includes(query)

          );

        }
      );

  }


  if(allPosts.length===0){

    feed.innerHTML=`

      <div class="empty">

        No posts found.

      </div>

    `;

    return;

  }


  feed.innerHTML=
    allPosts.map(
      function(post){

        if(
          String(post.id)
          .startsWith("user_")
        ){

          return renderUserPost(
            post,
            following
          );

        }


        return renderDefaultPost(
          post,
          defaultData,
          following
        );

      }
    ).join("");

}


/* =========================
   ATTRIBUTE ESCAPE
========================= */

function escapeAttribute(str){

  return String(str)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      "&quot;"
    );

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast=
    document.getElementById(
      "toast"
    );


  toast.textContent=
    message;


  toast.style.display=
    "block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=
    setTimeout(
      function(){

        toast.style.display=
          "none";

      },
      2500
    );

}


/* =========================
   START
========================= */

renderPosts();
