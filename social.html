<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCrush - Social</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#050713;
  color:white;
  min-height:100vh;
}

nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:#090b18;
  border-bottom:1px solid #25283d;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:bold;
  background:linear-gradient(90deg,#a000ff,#ff22bd,#168cff);
  -webkit-background-clip:text;
  color:transparent;
}

.navLinks{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.navLinks a{
  color:#bbb;
  text-decoration:none;
  font-size:14px;
}

.navLinks a:hover,
.navLinks .active{
  color:#fff;
}

.container{
  width:92%;
  max-width:900px;
  margin:auto;
}

.hero{
  padding:40px 0 25px;
  text-align:center;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.gradient{
  background:linear-gradient(90deg,#a000ff,#ff22bd,#168cff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#aaa;
  font-size:15px;
}

.createBox{
  background:#0d1020;
  border:1px solid #292d48;
  border-radius:18px;
  padding:20px;
  margin-bottom:25px;
}

.userTop{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#22263b;
}

.userName{
  font-weight:bold;
}

.handle{
  color:#888;
  font-size:13px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:none;
  background:#080a15;
  color:white;
  border:1px solid #292d48;
  border-radius:12px;
  padding:14px;
  outline:none;
  font-size:15px;
}

textarea:focus{
  border-color:#8b35ff;
}

.createActions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  gap:10px;
}

.fileBtn{
  color:#bbb;
  cursor:pointer;
  font-size:14px;
}

.fileBtn:hover{
  color:white;
}

#imageInput{
  display:none;
}

.preview{
  margin-top:12px;
  display:none;
}

.preview img{
  max-width:100%;
  max-height:300px;
  border-radius:12px;
}

.postBtn{
  border:none;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(90deg,#8b00ff,#ff22bd);
}

.postBtn:hover{
  opacity:.9;
}

.searchBox{
  margin-bottom:20px;
}

.searchBox input{
  width:100%;
  background:#0d1020;
  border:1px solid #292d48;
  color:white;
  padding:13px 16px;
  border-radius:12px;
  outline:none;
}

.post{
  background:#0d1020;
  border:1px solid #292d48;
  border-radius:18px;
  padding:18px;
  margin-bottom:20px;
}

.postHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.postUser{
  display:flex;
  align-items:center;
  gap:10px;
}

.followBtn{
  border:1px solid #633cff;
  background:transparent;
  color:#fff;
  padding:7px 13px;
  border-radius:18px;
  cursor:pointer;
  font-size:12px;
}

.followBtn.following{
  background:#633cff;
}

.postText{
  margin:15px 0;
  color:#ddd;
  line-height:1.5;
  white-space:pre-wrap;
}

.postImage{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:14px;
  margin-top:8px;
}

.postActions{
  display:flex;
  gap:22px;
  border-top:1px solid #25283d;
  padding-top:13px;
  margin-top:15px;
}

.actionBtn{
  border:none;
  background:none;
  color:#aaa;
  cursor:pointer;
  font-size:14px;
}

.actionBtn:hover{
  color:white;
}

.actionBtn.liked{
  color:#ff3b7f;
}

.comments{
  margin-top:15px;
  display:none;
}

.commentList{
  margin-bottom:10px;
}

.comment{
  background:#080a15;
  padding:9px 11px;
  border-radius:10px;
  margin-bottom:7px;
  font-size:13px;
}

.comment strong{
  color:#fff;
}

.commentInput{
  display:flex;
  gap:8px;
}

.commentInput input{
  flex:1;
  background:#080a15;
  border:1px solid #292d48;
  color:white;
  border-radius:10px;
  padding:9px;
  outline:none;
}

.commentInput button{
  border:none;
  background:#633cff;
  color:white;
  border-radius:10px;
  padding:0 14px;
  cursor:pointer;
}

.deleteBtn{
  color:#ff5b6e;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#171a2b;
  border:1px solid #393e5c;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  display:none;
  z-index:9999;
}

footer{
  text-align:center;
  color:#666;
  padding:40px 0;
  font-size:13px;
}

@media(max-width:600px){

  nav{
    padding:12px 4%;
  }

  .navLinks{
    gap:10px;
  }

  .navLinks a{
    font-size:12px;
  }

  .hero h1{
    font-size:30px;
  }

  .createActions{
    flex-direction:column;
    align-items:stretch;
  }

  .postBtn{
    width:100%;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">ZCrush</div>

  <div class="navLinks">
    <a href="index.html">Home</a>
    <a href="social.html" class="active">Social</a>
    <a href="gaming.html">Gaming</a>
    <a href="shorts.html">Shorts</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="profile.html">Profile</a>
  </div>
</nav>

<div class="container">

  <section class="hero">
    <h1>Welcome to <span class="gradient">ZCrush Social</span></h1>
    <p>Connect • Share • Like • Comment • Follow</p>
  </section>

  <!-- CREATE POST -->
  <div class="createBox">

    <div class="userTop">
      <img id="currentAvatar" class="avatar">

      <div>
        <div class="userName" id="currentName">ZCrush User</div>
        <div class="handle" id="currentHandle">@zcrushuser</div>
      </div>
    </div>

    <textarea id="postText"
      placeholder="What's happening on ZCrush?"></textarea>

    <div class="preview" id="preview">
      <img id="previewImg">
    </div>

    <div class="createActions">

      <label class="fileBtn">
        📷 Add Photo
        <input type="file" id="imageInput" accept="image/*">
      </label>

      <button class="postBtn" onclick="createPost()">
        Post
      </button>

    </div>

  </div>

  <!-- SEARCH -->
  <div class="searchBox">
    <input
      type="text"
      id="searchInput"
      placeholder="Search posts or users..."
      oninput="renderPosts()">
  </div>

  <!-- FEED -->
  <div id="feed"></div>

</div>

<footer>
  © 2026 ZCrush • Connect. Create. Explore.
</footer>

<div class="toast" id="toast"></div>

<script>

/* =========================
   LOGIN PROTECTION
========================= */

if(localStorage.getItem("zcrushLoggedIn") !== "true"){
  alert("Please login to use ZCrush Social.");
  window.location.href="login.html";
}


/* =========================
   CURRENT USER
========================= */

const currentUser = {
  name: localStorage.getItem("zcrushUserName") || "ZCrush User",
  handle: localStorage.getItem("zcrushUserHandle") || "@zcrushuser",
  photo: localStorage.getItem("zcrushProfilePhoto") || ""
};

document.getElementById("currentName").textContent=currentUser.name;
document.getElementById("currentHandle").textContent=currentUser.handle;

const currentAvatar=document.getElementById("currentAvatar");

if(currentUser.photo){
  currentAvatar.src=currentUser.photo;
}else{
  currentAvatar.src="https://via.placeholder.com/100/1b1f35/ffffff?text=Z";
}


/* =========================
   STORAGE HELPERS
========================= */

function getPosts(){

  try{

    const data=JSON.parse(
      localStorage.getItem("zcrushPosts") || "[]"
    );

    return Array.isArray(data) ? data : [];

  }catch(e){

    return [];

  }

}

function savePosts(posts){

  try{

    localStorage.setItem(
      "zcrushPosts",
      JSON.stringify(posts)
    );

    return true;

  }catch(e){

    showToast("Storage full. Please remove some posts/images.");
    return false;

  }

}


/* =========================
   FOLLOW STORAGE
========================= */

function getFollowing(){

  try{

    const data=JSON.parse(
      localStorage.getItem("zcrushFollowing") || "[]"
    );

    return Array.isArray(data) ? data : [];

  }catch(e){

    return [];

  }

}

function saveFollowing(list){

  localStorage.setItem(
    "zcrushFollowing",
    JSON.stringify(list)
  );

}


/* =========================
   DEFAULT POSTS
========================= */

const defaultPosts=[

  {
    id:"default_1",
    name:"ZCrush Official",
    handle:"@zcrush",
    photo:"",
    text:"Welcome to ZCrush! 🚀 Create, connect and explore everything in one place.",
    image:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=80"
  },

  {
    id:"default_2",
    name:"ZCrush Gaming",
    handle:"@zcrushgaming",
    photo:"",
    text:"Gaming on ZCrush 🎮 Who is ready for the next level?",
    image:"https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80"
  },

  {
    id:"default_3",
    name:"ZCrush Creator",
    handle:"@creator",
    photo:"",
    text:"Share your creativity with the ZCrush community ✨",
    image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80"
  }

];


/* =========================
   DEFAULT POST DATA
========================= */

function getDefaultData(){

  try{

    const data=JSON.parse(
      localStorage.getItem("zcrushDefaultPosts") || "{}"
    );

    return data && typeof data==="object" ? data : {};

  }catch(e){

    return {};

  }

}

function saveDefaultData(data){

  localStorage.setItem(
    "zcrushDefaultPosts",
    JSON.stringify(data)
  );

}


/* =========================
   IMAGE UPLOAD
========================= */

let selectedImage="";

document.getElementById("imageInput")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    showToast("Please select an image.");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(e){

    const img=new Image();

    img.onload=function(){

      const maxWidth=1200;

      let width=img.width;
      let height=img.height;

      if(width>maxWidth){

        height=
          Math.round(height*(maxWidth/width));

        width=maxWidth;

      }

      const canvas=document.createElement("canvas");

      canvas.width=width;
      canvas.height=height;

      const ctx=canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      selectedImage=
        canvas.toDataURL("image/jpeg",0.82);

      document.getElementById("previewImg").src=
        selectedImage;

      document.getElementById("preview").style.display=
        "block";

    };

    img.src=e.target.result;

  };

  reader.readAsDataURL(file);

});


/* =========================
   CREATE POST
========================= */

function createPost(){

  const text=
    document.getElementById("postText")
    .value
    .trim();

  if(!text && !selectedImage){

    showToast("Write something or add a photo.");
    return;

  }

  const posts=getPosts();

  const newPost={

    id:"user_"+Date.now(),

    name:currentUser.name,

    handle:currentUser.handle,

    photo:currentUser.photo,

    text:text,

    image:selectedImage,

    liked:false,

    likes:0,

    comments:[],

    createdAt:Date.now(),

    owner:currentUser.handle

  };

  posts.unshift(newPost);

  if(!savePosts(posts)) return;

  document.getElementById("postText").value="";

  document.getElementById("imageInput").value="";

  document.getElementById("preview").style.display="none";

  selectedImage="";

  renderPosts();

  showToast("Post published successfully! 🎉");

}


/* =========================
   LIKE USER POST
========================= */

function likeUserPost(id){

  const posts=getPosts();

  const post=posts.find(p=>p.id===id);

  if(!post) return;

  post.likes=Number(post.likes || 0);

  if(post.liked){

    post.likes--;

  }else{

    post.likes++;

  }

  post.liked=!post.liked;

  savePosts(posts);

  renderPosts();

}


/* =========================
   LIKE DEFAULT POST
========================= */

function likeDefaultPost(id){

  const data=getDefaultData();

  if(!data[id]){

    data[id]={
      liked:false,
      likes:0,
      comments:[]
    };

  }

  if(data[id].liked){

    data[id].likes--;

  }else{

    data[id].likes++;

  }

  data[id].liked=!data[id].liked;

  saveDefaultData(data);

  renderPosts();

}


/* =========================
   FOLLOW
========================= */

function toggleFollow(handle){

  if(handle===currentUser.handle){
    showToast("You cannot follow yourself.");
    return;
  }

  const following=getFollowing();

  const index=following.indexOf(handle);

  if(index===-1){

    following.push(handle);

    showToast("Following "+handle+" ✓");

  }else{

    following.splice(index,1);

    showToast("Unfollowed "+handle);

  }

  saveFollowing(following);

  renderPosts();

}


/* =========================
   COMMENTS
========================= */

function toggleComments(id){

  const box=
    document.getElementById("comments_"+id);

  if(!box) return;

  box.style.display=
    box.style.display==="block"
      ? "none"
      : "block";

}


function addUserComment(id){

  const input=
    document.getElementById("commentInput_"+id);

  const text=input.value.trim();

  if(!text) return;

  const posts=getPosts();

  const post=posts.find(p=>p.id===id);

  if(!post) return;

  if(!Array.isArray(post.comments)){
    post.comments=[];
  }

  post.comments.push({

    name:currentUser.name,
    handle:currentUser.handle,
    text:text,
    time:Date.now()

  });

  savePosts(posts);

  input.value="";

  renderPosts();

  setTimeout(function(){

    const box=
      document.getElementById("comments_"+id);

    if(box) box.style.display="block";

  },20);

}


function addDefaultComment(id){

  const input=
    document.getElementById("commentInput_"+id);

  const text=input.value.trim();

  if(!text) return;

  const data=getDefaultData();

  if(!data[id]){

    data[id]={
      liked:false,
      likes:0,
      comments:[]
    };

  }

  if(!Array.isArray(data[id].comments)){
    data[id].comments=[];
  }

  data[id].comments.push({

    name:currentUser.name,
    handle:currentUser.handle,
    text:text,
    time:Date.now()

  });

  saveDefaultData(data);

  input.value="";

  renderPosts();

  setTimeout(function(){

    const box=
      document.getElementById("comments_"+id);

    if(box) box.style.display="block";

  },20);

}


/* =========================
   DELETE POST
========================= */

function deletePost(id){

  const ok=
    confirm("Delete this post?");

  if(!ok) return;

  let posts=getPosts();

  posts=
    posts.filter(p=>p.id!==id);

  savePosts(posts);

  renderPosts();

  showToast("Post deleted.");

}


/* =========================
   SHARE
========================= */

async function sharePost(id){

  const shareData={

    title:"ZCrush",

    text:"Check this post on ZCrush!",

    url:window.location.href

  };

  try{

    if(navigator.share){

      await navigator.share(shareData);

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      showToast("Link copied!");

    }

  }catch(e){}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(str){

  if(str===undefined || str===null)
    return "";

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AVATAR
========================= */

function avatarHTML(photo,name){

  if(photo){

    return `
      <img
        class="avatar"
        src="${escapeHTML(photo)}"
        alt="Profile"
      >
    `;

  }

  return `
    <div class="avatar"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:bold;
      "
    >
      ${escapeHTML(
        (name || "Z").charAt(0).toUpperCase()
      )}
    </div>
  `;

}


/* =========================
   RENDER COMMENTS
========================= */

function commentsHTML(comments){

  if(!Array.isArray(comments) || comments.length===0){

    return `
      <div class="empty"
        style="padding:10px 0;font-size:13px;">
        No comments yet.
      </div>
    `;

  }

  return comments.map(function(c){

    return `
      <div class="comment">
        <strong>${escapeHTML(c.name)}</strong>
        <div>${escapeHTML(c.text)}</div>
      </div>
    `;

  }).join("");

}


/* =========================
   RENDER POST
========================= */

function renderUserPost(post,following){

  const liked=post.liked===true;

  const comments=
    Array.isArray(post.comments)
      ? post.comments
      : [];

  const isFollowing=
    following.includes(post.handle);

  const canDelete=
    post.owner===currentUser.handle ||
    post.handle===currentUser.handle;

  return `

    <article class="post">

      <div class="postHeader">

        <div class="postUser">

          ${avatarHTML(
            post.photo,
            post.name
          )}

          <div>

            <div class="userName">
              ${escapeHTML(post.name)}
            </div>

            <div class="handle">
              ${escapeHTML(post.handle)}
            </div>

          </div>

        </div>

        <div>

          ${
            post.handle!==currentUser.handle
            ? `
              <button
                class="followBtn ${
                  isFollowing ? "following" : ""
                }"
                onclick="toggleFollow('${escapeAttribute(post.handle)}')"
              >
                ${
                  isFollowing
                    ? "Following"
                    : "Follow"
                }
              </button>
            `
            : `
              <button
                class="followBtn deleteBtn"
                onclick="deletePost('${escapeAttribute(post.id)}')"
              >
                Delete
              </button>
            `
          }

        </div>

      </div>

      ${
        post.text
        ? `
          <div class="postText">
            ${escapeHTML(post.text)}
          </div>
        `
        : ""
      }

      ${
        post.image
        ? `
          <img
            class="postImage"
            src="${escapeHTML(post.image)}"
            alt="Post image"
          >
        `
        : ""
      }

      <div class="postActions">

        <button
          class="actionBtn ${liked ? "liked" : ""}"
          onclick="likeUserPost('${escapeAttribute(post.id)}')"
        >
          ${liked ? "❤️" : "♡"}
          ${post.likes || 0}
        </button>

        <button
          class="actionBtn"
          onclick="toggleComments('${escapeAttribute(post.id)}')"
        >
          💬 ${comments.length}
        </button>

        <button
          class="actionBtn"
          onclick="sharePost('${escapeAttribute(post.id)}')"
        >
          ↗ Share
        </button>

      </div>

      <div
        class="comments"
        id="comments_${escapeAttribute(post.id)}"
      >

        <div class="commentList">
          ${commentsHTML(comments)}
        </div>

        <div class="commentInput">

          <input
            id="commentInput_${escapeAttribute(post.id)}"
            placeholder="Write a comment..."
          >

          <button
            onclick="addUserComment('${escapeAttribute(post.id)}')"
          >
            Send
          </button>

        </div>

      </div>

    </article>

  `;

}


function renderDefaultPost(post,data,following){

  const saved=
    data[post.id] || {
      liked:false,
      likes:0,
      comments:[]
    };

  const isFollowing=
    following.includes(post.handle);

  const comments=
    Array.isArray(saved.comments)
      ? saved.comments
      : [];

  return `

    <article class="post">

      <div class="postHeader">

        <div class="postUser">

          ${avatarHTML(
            post.photo,
            post.name
          )}

          <div>

            <div class="userName">
              ${escapeHTML(post.name)}
            </div>

            <div class="handle">
              ${escapeHTML(post.handle)}
            </div>

          </div>

        </div>

        <button
          class="followBtn ${
            isFollowing ? "following" : ""
          }"
          onclick="toggleFollow('${escapeAttribute(post.handle)}')"
        >
          ${
            isFollowing
              ? "Following"
              : "Follow"
          }
        </button>

      </div>

      <div class="postText">
        ${escapeHTML(post.text)}
      </div>

      ${
        post.image
        ? `
          <img
            class="postImage"
            src="${escapeHTML(post.image)}"
            alt="Post image"
          >
        `
        : ""
      }

      <div class="postActions">

        <button
          class="actionBtn ${
            saved.liked ? "liked" : ""
          }"
          onclick="likeDefaultPost('${post.id}')"
        >
          ${saved.liked ? "❤️" : "♡"}
          ${saved.likes || 0}
        </button>

        <button
          class="actionBtn"
          onclick="toggleComments('${post.id}')"
        >
          💬 ${comments.length}
        </button>

        <button
          class="actionBtn"
          onclick="sharePost('${post.id}')"
        >
          ↗ Share
        </button>

      </div>

      <div
        class="comments"
        id="comments_${post.id}"
      >

        <div class="commentList">
          ${commentsHTML(comments)}
        </div>

        <div class="commentInput">

          <input
            id="commentInput_${post.id}"
            placeholder="Write a comment..."
          >

          <button
            onclick="addDefaultComment('${post.id}')"
          >
            Send
          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================
   SEARCH + FEED
========================= */

function renderPosts(){

  const feed=
    document.getElementById("feed");

  const query=
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const userPosts=getPosts();

  const defaultData=getDefaultData();

  const following=getFollowing();

  let allPosts=[
    ...userPosts,
    ...defaultPosts
  ];

  if(query){

    allPosts=allPosts.filter(function(post){

      return (

        String(post.name || "")
          .toLowerCase()
          .includes(query)

        ||

        String(post.handle || "")
          .toLowerCase()
          .includes(query)

        ||

        String(post.text || "")
          .toLowerCase()
          .includes(query)

      );

    });

  }

  if(allPosts.length===0){

    feed.innerHTML=`
      <div class="empty">
        No posts found.
      </div>
    `;

    return;

  }

  feed.innerHTML=
    allPosts.map(function(post){

      if(String(post.id).startsWith("user_")){

        return renderUserPost(
          post,
          following
        );

      }

      return renderDefaultPost(
        post,
        defaultData,
        following
      );

    }).join("");

}


/* =========================
   ATTRIBUTE ESCAPE
========================= */

function escapeAttribute(str){

  return String(str)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast=
    document.getElementById("toast");

  toast.textContent=message;

  toast.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=
    setTimeout(function(){

      toast.style.display="none";

    },2500);

}


/* =========================
   START
========================= */

renderPosts();

</script>
