
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCrush - Home</title>

<!-- Lucide Icons: Load BEFORE JavaScript -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* =====================================
   ZCRUSH DARK THEME
===================================== */

:root{
  color-scheme:dark;

  --bg:#08070b;
  --card:#121016;
  --text:#ffffff;
  --muted:#a8a2b0;
  --border:#292431;
  --purple:#241638;
  --accent:#b77aff;
  --post:#211d27;
  --button:#302b36;
  --shadow:0 5px 20px #0003;
}

/* =====================================
   ZCRUSH LIGHT THEME
===================================== */

body.light{
  color-scheme:light;

  --bg:#f5f4f8;
  --card:#ffffff;
  --text:#211b2a;
  --muted:#777080;
  --border:#e7e1ec;
  --purple:#eee5f8;
  --accent:#8142b7;
  --post:#f0edf3;
  --button:#eae5ef;
  --shadow:0 5px 20px #0000000b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .2s,color .2s;
}

/* TOPBAR */

.topbar{
  height:70px;
  width:100%;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:var(--purple);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
  color:var(--text);
  text-decoration:none;
}

.logo-z{
  color:#ff3030;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:17px;
}

.search-box{
  width:250px;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:22px;
  outline:none;
  background:var(--card);
  color:var(--text);
}

.top-icon{
  background:none;
  border:0;
  color:var(--text);
  cursor:pointer;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-icon i{
  width:22px;
  height:22px;
  stroke-width:1.8;
}

/* SIDEBAR */

.sidebar{
  width:230px;
  position:fixed;
  top:70px;
  bottom:0;
  left:0;
  padding:25px 15px;
  background:var(--bg);
  border-right:1px solid var(--border);
  z-index:500;
}

.menu-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  margin:5px 12px 20px;
}

.nav-link{
  display:flex;
  align-items:center;
  gap:15px;
  padding:13px 14px;
  margin-bottom:7px;
  border-radius:12px;
  color:var(--text);
  text-decoration:none;
  font-size:15px;
}

.nav-link:hover,
.nav-link.active{
  background:var(--purple);
  color:var(--accent);
}

.nav-icon{
  width:23px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-icon i{
  width:20px;
  height:20px;
  stroke-width:1.8;
}

/* MAIN */

.main{
  margin-left:230px;
  width:calc(100% - 230px);
  max-width:1000px;
  padding:25px;
}

/* CREATE POST */

.create-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:30px;
  box-shadow:var(--shadow);
}

.section-heading,
.feed-heading{
  font-size:21px;
  font-weight:700;
  margin-bottom:18px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--button);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  font-size:19px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-input{
  width:100%;
  min-height:65px;
  resize:vertical;
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:8px 0;
}

.post-input::placeholder{
  color:var(--muted);
}

.post-options{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.post-option{
  border:0;
  border-radius:20px;
  padding:9px 16px;
  font-size:14px;
  cursor:pointer;
  background:var(--button);
}

.photo-option{color:#58a9ff;background:#10233a}
.video-option{color:#4ad17b;background:#102b1c}
.text-option{color:#c58cff;background:#291839}

#photoInput,#videoInput{
  display:none;
}

.media-preview{
  display:none;
  margin-top:15px;
  position:relative;
}

.media-preview img,
.media-preview video{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:12px;
  background:var(--post);
}

.remove-media{
  position:absolute;
  top:8px;
  right:8px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#222;
  color:white;
  cursor:pointer;
  z-index:2;
}

.post-submit{
  margin-top:15px;
  padding:10px 25px;
  border:0;
  border-radius:25px;
  background:#8b4cc4;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* FEED */

.feed-heading{
  margin:30px 0 20px;
}

.post-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:22px;
  box-shadow:var(--shadow);
}

.post-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:17px;
}

.creator-info{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.creator-name{
  font-size:16px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.creator-handle{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.follow-btn{
  background:var(--button);
  border:0;
  border-radius:20px;
  color:var(--text);
  padding:8px 14px;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}

.post-content{
  width:100%;
  min-height:100px;
  background:var(--post);
  border-radius:15px;
  overflow:hidden;
}

.post-content img,
.post-content video{
  width:100%;
  max-height:500px;
  object-fit:contain;
  display:block;
}

.post-text{
  padding:20px;
  color:var(--text);
  font-size:16px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:15px;
}

.action-left{
  display:flex;
  align-items:center;
  gap:20px;
}

.action-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:none;
  border:0;
  color:var(--muted);
  cursor:pointer;
  transition:color .2s,transform .2s;
}

.action-btn:hover{
  color:var(--accent);
  transform:scale(1.08);
}

.action-btn svg{
  width:23px;
  height:23px;
  stroke-width:1.8;
}

.action-count{
  font-size:12px;
  color:var(--muted);
}

.action-btn.active{
  color:#e65b9e;
}

.liked-icon{
  fill:#e65b9e;
  stroke:#e65b9e;
}

.saved-icon{
  color:var(--accent);
  fill:var(--accent);
}

/* COMMENTS */

.comments-area{
  margin-top:15px;
}

.comment-row{
  padding:10px 0;
  border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;
}

.comment-row strong{
  color:var(--text);
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.comment-input{
  flex:1;
  min-width:0;
  padding:11px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--post);
  color:var(--text);
  outline:none;
}

.comment-submit{
  padding:10px 16px;
  border:0;
  border-radius:20px;
  background:#8b4cc4;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* NOTIFICATIONS */

.notification-panel{
  display:none;
  position:fixed;
  top:76px;
  right:15px;
  width:min(350px,92vw);
  max-height:65vh;
  overflow-y:auto;
  padding:16px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:15px;
  z-index:3000;
  box-shadow:var(--shadow);
}

.notice-item{
  padding:12px 4px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

.notice-time{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

/* TOAST */

.toast{
  display:none;
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:#30233b;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  z-index:5000;
  max-width:90%;
  text-align:center;
  font-size:14px;
}

/* MOBILE NAV */

.bottom-nav{
  display:none;
}

/* RESPONSIVE */

@media(max-width:800px){

  .topbar{
    height:65px;
    padding:0 14px;
  }

  .logo{
    font-size:27px;
  }

  .top-actions{
    gap:12px;
  }

  .search-box{
    width:125px;
    padding:8px 10px;
  }

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:18px 13px 105px;
  }

  .create-box{
    padding:17px;
    border-radius:15px;
  }

  .post-card{
    padding:14px;
    border-radius:15px;
  }

  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:76px;
    background:var(--purple);
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-top:1px solid var(--border);
    z-index:2000;
  }

  .bottom-link{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
  }

  .bottom-link i{
    width:28px;
    height:28px;
    stroke-width:1.9;
  }

  .bottom-link.active{
    color:var(--accent);
    font-weight:700;
  }

  .bottom-link.active i{
    color:var(--accent);
  }
}

/* SMALL MOBILE */

@media(max-width:380px){

  .logo{
    font-size:23px;
  }

  .top-actions{
    gap:8px;
  }

  .search-box{
    width:95px;
  }

  .post-options{
    gap:6px;
  }

  .post-option{
    padding:8px 11px;
    font-size:12px;
  }
}

</style>
</head>

<script>

/* =====================================
   1. HELPERS
===================================== */

function $(id){
  return document.getElementById(id);
}

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g,c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[c]);
}

function getData(key,fallback){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(error){
    return fallback;
  }
}

function saveData(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  }catch(error){
    showToast("Browser storage full. Remove old posts or media.");
    return false;
  }
}

function showToast(message){

  const el = $("toast");

  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    el.style.display = "none";
  },2500);
}


/* =====================================
   2. STORAGE
===================================== */

let posts = getData("zcrushPosts",[]);
let defaultPosts = getData("zcrushDefaultPosts",[]);
let following = getData("zcrushFollowing",[]);
let savedPosts = getData("zcrushSavedPosts",[]);
let notifications = getData("zcrushNotifications",[]);

if(!Array.isArray(posts)) posts = [];
if(!Array.isArray(defaultPosts)) defaultPosts = [];
if(!Array.isArray(following)) following = [];
if(!Array.isArray(savedPosts)) savedPosts = [];
if(!Array.isArray(notifications)) notifications = [];

let selectedMedia = "";
let selectedType = "";
let searchValue = "";

let sharedPostId = new URLSearchParams(
  window.location.search
).get("post");


/* =====================================
   3. USER
===================================== */

function currentUser(){

  return {
    name:localStorage.getItem("zcrushUserName") || "ZCrush User",
    handle:localStorage.getItem("zcrushUserHandle") || "@zcrushuser",
    photo:localStorage.getItem("zcrushProfilePhoto") || ""
  };
}

function setupUser(){

  const user = currentUser();

  $("myName").textContent = user.name;

  $("myAvatar").innerHTML = user.photo
    ? `<img src="${safe(user.photo)}" alt="Profile">`
    : safe(user.name.charAt(0).toUpperCase());
}


/* =====================================
   4. POST HELPERS
===================================== */

function allPosts(){

  const combined = [...posts];

  defaultPosts.forEach(post => {

    if(!combined.some(item =>
      String(item.id) === String(post.id)
    )){
      combined.push(post);
    }

  });

  return combined;
}

function findPost(id){

  let post = posts.find(p =>
    String(p.id) === String(id)
  );

  if(post){
    return {
      post,
      source:"user"
    };
  }

  post = defaultPosts.find(p =>
    String(p.id) === String(id)
  );

  if(post){
    return {
      post,
      source:"default"
    };
  }

  return null;
}

function saveFoundPost(found){

  return found.source === "user"
    ? saveData("zcrushPosts",posts)
    : saveData("zcrushDefaultPosts",defaultPosts);
}

function timeAgo(time){

  const seconds = Math.floor(
    (Date.now() - (time || Date.now())) / 1000
  );

  if(seconds < 60) return "Just now";

  if(seconds < 3600){
    return Math.floor(seconds/60)+"m ago";
  }

  if(seconds < 86400){
    return Math.floor(seconds/3600)+"h ago";
  }

  return Math.floor(seconds/86400)+"d ago";
}


/* =====================================
   5. MEDIA SELECTION
===================================== */

function clearMedia(){

  selectedMedia = "";
  selectedType = "";

  $("photoInput").value = "";
  $("videoInput").value = "";

  $("previewContent").innerHTML = "";
  $("mediaPreview").style.display = "none";
}

function compressPhoto(file){

  return new Promise((resolve,reject) => {

    const reader = new FileReader();

    reader.onload = event => {

      const img = new Image();

      img.onload = () => {

        const canvas = document.createElement("canvas");

        const scale = Math.min(1,1200/img.width);

        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);

        canvas.getContext("2d").drawImage(
          img,0,0,canvas.width,canvas.height
        );

        resolve(
          canvas.toDataURL("image/jpeg",0.7)
        );
      };

      img.onerror = reject;
      img.src = event.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function selectMedia(file,type){

  if(!file) return;

  if(type === "photo" && file.size > 8*1024*1024){
    showToast("Choose a photo smaller than 8 MB.");
    return;
  }

  if(type === "video" && file.size > 15*1024*1024){
    showToast("Choose a video smaller than 15 MB.");
    return;
  }

  try{

    if(type === "photo"){

      selectedMedia = await compressPhoto(file);

    }else{

      selectedMedia = await new Promise((resolve,reject) => {

        const reader = new FileReader();

        reader.onload = event => resolve(event.target.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
      });
    }

    selectedType = type;

    if(type === "photo"){

      $("previewContent").innerHTML =
        `<img src="${selectedMedia}" alt="Preview">`;

    }else{

      $("previewContent").innerHTML =
        `<video controls playsinline><source src="${selectedMedia}"></video>`;
    }

    $("mediaPreview").style.display = "block";

  }catch(error){

    showToast("Unable to load this file.");
  }
}

$("choosePhoto").addEventListener("click",() => {
  $("photoInput").click();
});

$("chooseVideo").addEventListener("click",() => {
  $("videoInput").click();
});

$("photoInput").addEventListener("change",event => {
  selectMedia(event.target.files[0],"photo");
});

$("videoInput").addEventListener("change",event => {
  selectMedia(event.target.files[0],"video");
});

$("removeMediaBtn").addEventListener("click",clearMedia);

$("textPostBtn").addEventListener("click",() => {
  clearMedia();
  $("postText").focus();
});


/* =====================================
   6. CREATE POST
===================================== */

$("publishPostBtn").addEventListener("click",() => {

  const text = $("postText").value.trim();

  if(!text && !selectedMedia){
    showToast("Write something or choose media first.");
    return;
  }

  const user = currentUser();

  const post = {

    id:"user_"+Date.now(),

    name:user.name,
    handle:user.handle,
    photo:user.photo,

    text:text,

    image:selectedType === "photo" ? selectedMedia : "",
    video:selectedType === "video" ? selectedMedia : "",

    mediaType:selectedType || "text",

    liked:false,
    likes:0,
    comments:[],

    createdAt:Date.now(),
    owner:user.handle
  };

  posts.unshift(post);

  if(!saveData("zcrushPosts",posts)){
    posts.shift();
    return;
  }

  $("postText").value = "";

  clearMedia();

  renderPosts();

  showToast("Post published successfully!");
});


/* =====================================
   7. COMMENTS
===================================== */

function commentsHTML(post){

  const comments = Array.isArray(post.comments)
    ? post.comments
    : [];

  if(!comments.length){

    return `
      <p style="color:var(--muted);padding:10px 0;">
        No comments yet. Be the first to comment!
      </p>
    `;
  }

  return comments.map(comment => `

    <div class="comment-row">

      <strong>${safe(comment.name || "User")}</strong>

      <div style="margin-top:5px;color:var(--muted);">
        ${safe(comment.text)}
      </div>

      <div style="font-size:11px;color:var(--muted);margin-top:4px;">
        ${timeAgo(comment.createdAt)}
      </div>

    </div>

  `).join("");
}


/* =====================================
   8. RENDER POST
===================================== */

function renderPost(post){

  const user = currentUser();

  const own = post.owner
    ? post.owner === user.handle
    : post.handle === user.handle;

  const isFollowing = following.includes(post.handle);

  const isSaved = savedPosts.includes(String(post.id));

  const liked = Boolean(post.liked);

  const comments = Array.isArray(post.comments)
    ? post.comments
    : [];

  let media = "";

  if(post.image){

    media = `
      <div class="post-content">
        <img src="${safe(post.image)}" alt="Post image">
      </div>
    `;

  }else if(post.video){

    media = `
      <div class="post-content">
        <video controls playsinline preload="metadata">
          <source src="${safe(post.video)}">
        </video>
      </div>
    `;
  }

  if(post.text){

    media += `
      <div class="post-text">
        ${safe(post.text)}
      </div>
    `;
  }

  return `

    <article class="post-card" data-post-id="${safe(post.id)}">

      <!-- POST HEADER -->

      <div class="post-header">

        <div class="creator-info">

          <div class="avatar">

            ${post.photo
              ? `<img src="${safe(post.photo)}" alt="Creator">`
              : safe((post.name || "Z").charAt(0).toUpperCase())
            }

          </div>

          <div>

            <div class="creator-name">
              ${safe(post.name || "ZCrush User")}
            </div>

            <div class="creator-handle">
              ${safe(post.handle || "@zcrushuser")} · ${timeAgo(post.createdAt)}
            </div>

          </div>

        </div>

        <div style="display:flex;gap:7px;">

          ${!own ? `
            <button class="follow-btn" data-action="follow">
              ${isFollowing ? "Following" : "Follow"}
            </button>
          ` : ""}

          ${own ? `
            <button class="follow-btn" data-action="delete">
              Delete
            </button>
          ` : ""}

        </div>

      </div>

      <!-- POST MEDIA / TEXT -->

      ${media}

      <!-- POST ACTIONS -->

      <div class="post-actions">

        <div class="action-left">

          <!-- LIKE -->

          <button
            class="action-btn ${liked ? "active" : ""}"
            data-action="like"
            title="Like">

            <i
              data-lucide="heart"
              class="${liked ? "liked-icon" : ""}">
            </i>

            <span class="action-count">
              ${Number(post.likes) || 0}
            </span>

          </button>

          <!-- COMMENT -->

          <button
            class="action-btn"
            data-action="comment"
            title="Comment">

            <i data-lucide="message-circle"></i>

            <span class="action-count">
              ${comments.length}
            </span>

          </button>

          <!-- SHARE -->

          <button
            class="action-btn"
            data-action="share"
            title="Share">

            <i data-lucide="send"></i>

          </button>

        </div>

        <!-- SAVE -->

        <button
          class="action-btn ${isSaved ? "active" : ""}"
          data-action="save"
          title="${isSaved ? "Saved" : "Save Post"}">

          <i
            data-lucide="bookmark"
            class="${isSaved ? "saved-icon" : ""}">
          </i>

        </button>

      </div>

      <!-- COMMENT SECTION -->

      <div class="comments-area" style="display:none;">

        <div class="comments-list">
          ${commentsHTML(post)}
        </div>

        <div class="comment-form">

          <input
            type="text"
            class="comment-input"
            placeholder="Write a comment..."
            maxlength="500"
            autocomplete="off"
          >

          <button
            class="comment-submit"
            data-action="send-comment">
            Send
          </button>

        </div>

      </div>

    </article>

  `;
}


/* =====================================
   9. RENDER FEED
===================================== */

function renderPosts(){

  let list = allPosts();

  if(sharedPostId){

    list = list.filter(post =>
      String(post.id) === String(sharedPostId)
    );

    if(!list.length){

      $("feed").innerHTML = `

        <div class="post-card" style="text-align:center;padding:35px;">

          <h3>Post not found</h3>

          <p style="color:var(--muted);margin-top:8px;">
            This post is not available in this browser.
          </p>

          <button
            class="post-submit"
            onclick="goToHomeFeed()">
            Back to Home
          </button>

        </div>

      `;

      return;
    }

  }else if(searchValue){

    const q = searchValue.toLowerCase();

    list = list.filter(post =>

      String(post.name || "").toLowerCase().includes(q) ||

      String(post.handle || "").toLowerCase().includes(q) ||

      String(post.text || "").toLowerCase().includes(q)

    );
  }

  list.sort((a,b) =>
    (b.createdAt || 0) - (a.createdAt || 0)
  );

  if(!list.length){

    $("feed").innerHTML = `

      <div class="post-card" style="text-align:center;padding:35px;">

        <h3>No posts found</h3>

        <p style="color:var(--muted);margin-top:8px;">
          Create a post or try another search.
        </p>

      </div>

    `;

    return;
  }

  $("feed").innerHTML = list.map(renderPost).join("");

  if(window.lucide){
    lucide.createIcons();
  }
}


/* =====================================
   10. SHARED POST
===================================== */

function goToHomeFeed(){
  window.location.href = window.location.pathname;
}


/* =====================================
   11. NOTIFICATIONS
===================================== */

function addNotification(text,type,postId=""){

  notifications.unshift({
    id:"notice_"+Date.now(),
    text:text,
    type:type,
    postId:postId,
    read:false,
    createdAt:Date.now()
  });

  notifications = notifications.slice(0,100);
  saveData("zcrushNotifications",notifications);
  updateNotificationCount();
}

function updateNotificationCount(){

  const count = notifications.filter(
    notification => !notification.read
  ).length;

  const btn = $("notificationBtn");
  if(count > 0){
    btn.innerHTML = `<i data-lucide="bell"></i><sup style="font-size:10px;color:#ff70aa;position:absolute;top:2px;right:2px;">${count}</sup>`;
  }else{
    btn.innerHTML = `<i data-lucide="bell"></i>`;
  }
  if(window.lucide) lucide.createIcons();
}

function renderNotifications(){

  const panel = $("notificationPanel");

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";

  if(panel.style.display !== "block") return;

  panel.innerHTML = `

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

      <strong>Notifications</strong>

      <button class="follow-btn" id="markRead">
        Mark all read
      </button>

    </div>

    ${
      notifications.length

      ? notifications.map(notification => `

        <div class="notice-item">

          ${safe(notification.text)}

          <span class="notice-time">
            ${timeAgo(notification.createdAt)}
          </span>

          ${!notification.read
            ? `<span style="color:var(--accent);">New</span>`
            : ""
          }

        </div>

      `).join("")

      : `<p style="color:var(--muted);">No notifications yet.</p>`
    }

  `;

  const markRead = $("markRead");

  if(markRead){

    markRead.addEventListener("click",() => {

      notifications = notifications.map(notification => ({
        ...notification,
        read:true
      }));

      saveData("zcrushNotifications",notifications);
      updateNotificationCount();
      renderNotifications();

    });
  }
}

$("notificationBtn").addEventListener(
  "click",
  renderNotifications
);


/* =====================================
   12. SHARE POST
===================================== */

async function sharePost(post){

  const shareURL = new URL(window.location.href);
  shareURL.search = "";
  shareURL.hash = "";
  shareURL.searchParams.set("post", String(post.id));

  const shareData = {
    title:"ZCrush",
    text:"Check out this post on ZCrush!",
    url:shareURL.href
  };

  if(navigator.share){
    try{
      await navigator.share(shareData);
    }catch(error){
      if(error.name === "AbortError") return;
    }
    return;
  }

  try{
    await navigator.clipboard.writeText(shareURL.href);
    showToast("Post link copied!");
  }catch(error){
    showToast("Unable to copy link.");
  }
}


/* =====================================
   13. FEED ACTIONS
===================================== */

$("feed").addEventListener("click",async event => {

  const button = event.target.closest("[data-action]");
  if(!button) return;

  const card = button.closest(".post-card");
  if(!card) return;

  const found = findPost(card.dataset.postId);
  if(!found) return;

  const post = found.post;
  const action = button.dataset.action;
  const user = currentUser();

  if(action === "like"){

    post.liked = !post.liked;
    post.likes = Math.max(0,(Number(post.likes) || 0) + (post.liked ? 1 : -1));
    saveFoundPost(found);

    if(post.liked && post.handle !== user.handle){
      addNotification(user.name+" liked your post","like",post.id);
    }
    renderPosts();

  }else if(action === "follow"){

    if(following.includes(post.handle)){
      following = following.filter(handle => handle !== post.handle);
      showToast("Unfollowed successfully.");
    }else{
      following.push(post.handle);
      showToast("Following "+post.name);
      addNotification(user.name+" followed you","follow");
    }

    saveData("zcrushFollowing",following);
    renderPosts();

  }else if(action === "comment"){

    const area = card.querySelector(".comments-area");
    if(!area) return;

    area.style.display = area.style.display === "none" ? "block" : "none";
    if(area.style.display === "block"){
      const input = area.querySelector(".comment-input");
      if(input) input.focus();
    }

  }else if(action === "send-comment"){

    const input = card.querySelector(".comment-input");
    if(!input) return;

    const text = input.value.trim();
    if(!text){
      showToast("Write a comment first.");
      input.focus();
      return;
    }

    post.comments = Array.isArray(post.comments) ? post.comments : [];

    const comment = {
      id:"comment_"+Date.now(),
      name:user.name,
      handle:user.handle,
      text:text,
      createdAt:Date.now()
    };

    post.comments.push(comment);

    if(!saveFoundPost(found)){
      post.comments.pop();
      return;
    }

    if(post.handle !== user.handle){
      addNotification(user.name+" commented on your post","comment",post.id);
    }

    renderPosts();
    showToast("Comment added!");

  }else if(action === "save"){

    const id = String(post.id);

    if(savedPosts.includes(id)){
      savedPosts = savedPosts.filter(item => item !== id);
      showToast("Post removed from saved.");
    }else{
      savedPosts.push(id);
      showToast("Post saved!");
    }

    saveData("zcrushSavedPosts",savedPosts);
    renderPosts();

  }else if(action === "delete"){

    const isOwner = post.owner ? post.owner === user.handle : post.handle === user.handle;
    if(!isOwner){
      showToast("You can only delete your own posts.");
      return;
    }

    if(!confirm("Are you sure you want to delete this post?")) return;

    if(found.source === "user"){
      posts = posts.filter(item => String(item.id) !== String(post.id));
      saveData("zcrushPosts",posts);
    }else{
      defaultPosts = defaultPosts.filter(item => String(item.id) !== String(post.id));
      saveData("zcrushDefaultPosts",defaultPosts);
    }

    renderPosts();
    showToast("Post deleted.");

  }else if(action === "share"){
    await sharePost(post);
  }

});


/* =====================================
   14. COMMENT ENTER KEY
===================================== */

$("feed").addEventListener("keydown",event => {

  if(event.key === "Enter" && event.target.classList.contains("comment-input")){
    event.preventDefault();
    const card = event.target.closest(".post-card");
    if(!card) return;
    const sendButton = card.querySelector('[data-action="send-comment"]');
    if(sendButton) sendButton.click();
  }

});


/* =====================================
   15. SEARCH
===================================== */

$("searchInput").addEventListener("input",event => {
  searchValue = event.target.value.trim();
  if(sharedPostId){
    sharedPostId = null;
    history.replaceState({},"",window.location.pathname);
  }
  renderPosts();
});


/* =====================================
   16. AUTOMATIC DEVICE THEME
===================================== */

const deviceTheme = window.matchMedia("(prefers-color-scheme: dark)");

function applyDeviceTheme(){
  const isDark = deviceTheme.matches;
  document.body.classList.toggle("light",!isDark);
}

applyDeviceTheme();
if(deviceTheme.addEventListener){
  deviceTheme.addEventListener("change",applyDeviceTheme);
}else{
  deviceTheme.addListener(applyDeviceTheme);
}


/* =====================================
   17. Z-CONNECT
===================================== */

$("connectBtn").addEventListener("click",() => {
  showToast("Z-Connect is coming soon!");
});


/* =====================================
   18. INITIALIZE
===================================== */

setupUser();
updateNotificationCount();
renderPosts();

if(sharedPostId){
  setTimeout(() => {
    const postCard = document.querySelector(`[data-post-id="${CSS.escape(sharedPostId)}"]`);
    if(postCard){
      postCard.scrollIntoView({behavior:"smooth",block:"center"});
    }
  },300);
}

</script>
