<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCrush - Profile</title>

<!-- Lucide Icons: Load BEFORE JavaScript -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* =====================================
   ZCRUSH DARK THEME
===================================== */

:root{
  color-scheme:dark;

  --bg:#08070b;
  --card:#121016;
  --text:#ffffff;
  --muted:#a8a2b0;
  --border:#292431;
  --purple:#241638;
  --accent:#b77aff;
  --post:#211d27;
  --button:#302b36;
  --shadow:0 5px 20px #0003;
}

/* =====================================
   ZCRUSH LIGHT THEME
===================================== */

body.light{
  color-scheme:light;

  --bg:#f5f4f8;
  --card:#ffffff;
  --text:#211b2a;
  --muted:#777080;
  --border:#e7e1ec;
  --purple:#eee5f8;
  --accent:#8142b7;
  --post:#f0edf3;
  --button:#eae5ef;
  --shadow:0 5px 20px #0000000b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .2s,color .2s;
}

/* TOPBAR */

.topbar{
  height:70px;
  width:100%;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:var(--purple);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
  color:var(--text);
  text-decoration:none;
}

.logo-z{
  color:#ff3030;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:17px;
}

.search-box{
  width:250px;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:22px;
  outline:none;
  background:var(--card);
  color:var(--text);
  transition:border-color .2s;
}

.search-box:focus{
  border-color:var(--accent);
}

.top-icon{
  background:none;
  border:0;
  color:var(--text);
  cursor:pointer;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-icon i{
  width:22px;
  height:22px;
  stroke-width:1.8;
}

/* SIDEBAR */

.sidebar{
  width:230px;
  position:fixed;
  top:70px;
  bottom:0;
  left:0;
  padding:25px 15px;
  background:var(--bg);
  border-right:1px solid var(--border);
  z-index:500;
}

.menu-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  margin:5px 12px 20px;
}

.nav-link{
  display:flex;
  align-items:center;
  gap:15px;
  padding:13px 14px;
  margin-bottom:7px;
  border-radius:12px;
  color:var(--text);
  text-decoration:none;
  font-size:15px;
  transition:all .2s ease;
}

.nav-link:hover,
.nav-link.active{
  background:var(--purple);
  color:var(--accent);
}

.nav-icon{
  width:23px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-icon i{
  width:20px;
  height:20px;
  stroke-width:1.8;
}

/* MAIN */

.main{
  margin-left:230px;
  width:calc(100% - 230px);
  max-width:1000px;
  padding:25px;
}

/* PROFILE HEADER CARD */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:25px;
  transition:transform .2s ease;
}

.cover-photo{
  width:100%;
  height:170px;
  background:linear-gradient(135deg, #8b4cc4, #241638);
  position:relative;
  background-size:cover;
  background-position:center;
}

.cover-edit-btn{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  padding:7px 14px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:background .2s;
}

.cover-edit-btn:hover{
  background:rgba(0,0,0,0.8);
}

.profile-info{
  padding:20px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:15px;
}

.avatar-wrapper{
  position:relative;
  margin-top:-65px;
  width:95px;
  height:95px;
  cursor:pointer;
}

.avatar-container{
  width:100%;
  height:100%;
  border-radius:50%;
  background:var(--card);
  border:4px solid var(--card);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  color:var(--text);
  box-shadow:var(--shadow);
}

.avatar-container img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-edit-badge{
  position:absolute;
  bottom:2px;
  right:2px;
  background:var(--accent);
  color:white;
  width:26px;
  height:26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:bold;
  border:2px solid var(--card);
  z-index:2;
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
  transition:transform .15s ease;
}

.avatar-wrapper:hover .avatar-edit-badge{
  transform:scale(1.1);
}

.profile-header-actions{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  flex-wrap:wrap;
}

.user-names h1{
  font-size:22px;
  font-weight:800;
}

.user-names p{
  color:var(--muted);
  font-size:14px;
  margin-top:2px;
}

.bio-section{
  font-size:14px;
  color:var(--text);
  margin-top:8px;
  white-space:pre-wrap;
  line-height:1.4;
}

.edit-profile-btn{
  background:var(--button);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 18px;
  border-radius:20px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:all .2s ease;
}

.edit-profile-btn:hover{
  background:var(--purple);
  color:var(--accent);
  border-color:var(--accent);
}

.stats-row{
  display:flex;
  gap:25px;
  margin-top:5px;
}

.stat-item{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.stat-value{
  font-weight:800;
  font-size:18px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

/* TABS */

.tabs{
  display:flex;
  gap:10px;
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
}

.tab-btn{
  background:none;
  border:0;
  padding:12px 18px;
  color:var(--muted);
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .2s ease;
}

.tab-btn.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* CONTENT GRID */

.posts-grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:15px;
}

.grid-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  height:200px;
  overflow:hidden;
  position:relative;
  transition:transform .2s ease;
}

.grid-item:hover{
  transform:translateY(-2px);
}

.grid-item img, .grid-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.grid-text{
  padding:15px;
  font-size:13px;
  color:var(--text);
  overflow:hidden;
}

.view-badge{
  position:absolute;
  bottom:8px;
  left:8px;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(3px);
  color:white;
  padding:4px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:600;
}

.empty-msg{
  grid-column:1 / -1;
  text-align:center;
  padding:40px;
  color:var(--muted);
}

/* MODAL FOR EDIT PROFILE */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(5px);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:15px;
  opacity:0;
  transition:opacity .2s ease;
}

.modal.active{
  display:flex;
  opacity:1;
}

.modal-content{
  width:100%;
  max-width:480px;
  background:var(--card);
  color:var(--text);
  border-radius:18px;
  padding:22px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transform:scale(0.95);
  transition:transform .2s ease;
}

.modal.active .modal-content{
  transform:scale(1);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close-btn{
  border:0;
  background:var(--button);
  color:var(--text);
  border-radius:50%;
  width:32px;
  height:32px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.field-group{
  margin-bottom:14px;
}

.field-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
  color:var(--muted);
}

.field{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--bg);
  color:var(--text);
  outline:none;
  transition:border-color .2s;
}

.field:focus{
  border-color:var(--accent);
}

.primary-btn{
  width:100%;
  padding:12px;
  border-radius:20px;
  background:var(--accent);
  color:white;
  font-weight:700;
  border:0;
  cursor:pointer;
  transition:opacity .2s;
}

.primary-btn:hover{
  opacity:0.9;
}

/* NOTIFICATIONS & TOAST */

.notification-panel{
  display:none;
  position:fixed;
  top:76px;
  right:15px;
  width:min(350px,92vw);
  max-height:65vh;
  overflow-y:auto;
  padding:16px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:15px;
  z-index:3000;
  box-shadow:var(--shadow);
}

.toast{
  display:none;
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:#30233b;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  z-index:5000;
  max-width:90%;
  text-align:center;
  font-size:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* MOBILE NAV */

.bottom-nav{
  display:none;
}

/* RESPONSIVE */

@media(max-width:800px){

  .topbar{
    height:65px;
    padding:0 14px;
  }

  .logo{
    font-size:27px;
  }

  .top-actions{
    gap:12px;
  }

  .search-box{
    width:125px;
    padding:8px 10px;
  }

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:18px 13px 105px;
  }

  .posts-grid{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
  }

  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:76px;
    background:var(--purple);
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-top:1px solid var(--border);
    z-index:2000;
  }

  .bottom-link{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
  }

  .bottom-link i{
    width:28px;
    height:28px;
    stroke-width:1.9;
  }

  .bottom-link.active{
    color:var(--accent);
    font-weight:700;
  }

  .bottom-link.active i{
    color:var(--accent);
  }
}

</style>
</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

  <a href="index.html" class="logo">
    <span class="logo-z">Z</span>Crush
  </a>

  <div class="top-actions">

    <input
      type="search"
      id="searchInput"
      class="search-box"
      placeholder="Search..."
    >

    <button class="top-icon" id="notificationBtn" title="Notifications">
      <i data-lucide="bell"></i>
    </button>

    <button class="top-icon" id="connectBtn" title="Z-Connect">
      <i data-lucide="globe"></i>
    </button>

  </div>

</header>


<!-- DESKTOP SIDEBAR -->

<aside class="sidebar">

  <div class="menu-title">MENU</div>

  <a href="index.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="house"></i></span> Home
  </a>

  <a href="moments.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="sparkles"></i></span> Moments
  </a>

  <a href="shorts.html" class="nav-link">
    <span class="nav-icon"><i data-lucide="circle-play"></i></span> Shorts
  </a>

  <a href="profile.html" class="nav-link active">
    <span class="nav-icon"><i data-lucide="user-round"></i></span> Profile
  </a>

</aside>


<!-- MAIN -->

<main class="main">

  <section class="profile-card">
    <div class="cover-photo" id="coverPhotoBg">
      <button class="cover-edit-btn" onclick="$('coverInput').click()">
        <i data-lucide="camera" style="width:14px;height:14px;"></i> Cover
      </button>
      <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="updateCoverPhoto(this)">
    </div>

    <div class="profile-info">
      <div class="avatar-wrapper" onclick="$('avatarInput').click()" title="Click to change profile picture">
        <div class="avatar-container" id="profileAvatar">
          <span>Z</span>
        </div>
        <div class="avatar-edit-badge">+</div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="updateAvatarPhoto(this)">

      <div class="profile-header-actions">
        <div class="user-names">
          <h1 id="profileName">ZCrush User</h1>
          <p id="profileHandle">@zcrushuser</p>
          <div class="bio-section" id="profileBio">Welcome to my ZCrush profile!</div>
        </div>

        <button class="edit-profile-btn" onclick="openEditModal()">
          <i data-lucide="user-pen" style="width:16px;height:16px;"></i> Edit Profile
        </button>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-value" id="postCount">0</span>
          <span class="stat-label">Posts</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="followingCount">0</span>
          <span class="stat-label">Following</span>
        </div>
      </div>
    </div>
  </section>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('posts', this)">My Post</button>
    <button class="tab-btn" onclick="switchTab('shorts', this)">Short</button>
  </div>

  <!-- CONTENT GRID -->
  <div class="posts-grid" id="contentGrid"></div>

</main>


<!-- EDIT PROFILE MODAL -->

<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Edit Profile</h2>
      <button class="close-btn" onclick="closeEditModal()">✕</button>
    </div>

    <div class="field-group">
      <label>Name</label>
      <input type="text" class="field" id="editName" placeholder="Enter name">
    </div>

    <div class="field-group">
      <label>Username / Handle</label>
      <input type="text" class="field" id="editHandle" placeholder="@handle">
    </div>

    <div class="field-group">
      <label>Bio</label>
      <textarea class="field" id="editBio" rows="3" placeholder="Tell us about yourself..."></textarea>
    </div>

    <div class="field-group">
      <label>Change Profile Picture</label>
      <input type="file" class="field" id="modalAvatarInput" accept="image/*">
    </div>

    <div class="field-group">
      <label>Change Cover Image</label>
      <input type="file" class="field" id="modalCoverInput" accept="image/*">
    </div>

    <button class="primary-btn" onclick="saveProfileChanges()">Save Profile</button>
  </div>
</div>


<!-- NOTIFICATIONS PANEL -->
<div class="notification-panel" id="notificationPanel"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<!-- MOBILE BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="index.html" class="bottom-link">
    <i data-lucide="house"></i>
    <span>Home</span>
  </a>

  <a href="moments.html" class="bottom-link">
    <i data-lucide="sparkles"></i>
    <span>Moments</span>
  </a>

  <a href="zcam.html" class="bottom-link">
    <i data-lucide="aperture"></i>
    <span>ZCam</span>
  </a>

  <a href="shorts.html" class="bottom-link">
    <i data-lucide="circle-play"></i>
    <span>Shorts</span>
  </a>

  <a href="profile.html" class="bottom-link active">
    <i data-lucide="user-round"></i>
    <span>Profile</span>
  </a>

</nav>


<script>
const $ = id => document.getElementById(id);

function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(()=>t.style.display="none", 2500);
}

function loadProfile(){
  const name = localStorage.getItem("zcrushUserName") || "ZCrush User";
  const handle = localStorage.getItem("zcrushUserHandle") || "@zcrushuser";
  const photo = localStorage.getItem("zcrushProfilePhoto") || "";
  const cover = localStorage.getItem("zcrushCoverPhoto") || "";
  const bio = localStorage.getItem("zcrushUserBio") || "Welcome to my ZCrush profile!";

  $("profileName").textContent = name;
  $("profileHandle").textContent = handle;
  $("profileBio").textContent = bio;

  if(photo){
    $("profileAvatar").innerHTML = `<img src="${photo}" alt="Avatar">`;
  } else {
    $("profileAvatar").innerHTML = `<span>${name.charAt(0).toUpperCase()}</span>`;
  }

  if(cover){
    $("coverPhotoBg").style.backgroundImage = `url(${cover})`;
  }

  const following = JSON.parse(localStorage.getItem("zcrushFollowing") || "[]");
  $("followingCount").textContent = following.length;

  renderMyPostTab();
}

function updateAvatarPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    localStorage.setItem("zcrushProfilePhoto", e.target.result);
    loadProfile();
    showToast("Profile picture updated!");
  };
  reader.readAsDataURL(file);
}

function updateCoverPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    localStorage.setItem("zcrushCoverPhoto", e.target.result);
    loadProfile();
    showToast("Cover photo updated!");
  };
  reader.readAsDataURL(file);
}

function openEditModal(){
  $("editName").value = localStorage.getItem("zcrushUserName") || "ZCrush User";
  $("editHandle").value = localStorage.getItem("zcrushUserHandle") || "@zcrushuser";
  $("editBio").value = localStorage.getItem("zcrushUserBio") || "Welcome to my ZCrush profile!";
  $("modalAvatarInput").value = "";
  $("modalCoverInput").value = "";
  $("editModal").classList.add("active");
}

function closeEditModal(){
  $("editModal").classList.remove("active");
}

async function saveProfileChanges(){
  const name = $("editName").value.trim();
  const handle = $("editHandle").value.trim();
  const bio = $("editBio").value.trim();

  if(name) localStorage.setItem("zcrushUserName", name);
  if(handle) localStorage.setItem("zcrushUserHandle", handle);
  localStorage.setItem("zcrushUserBio", bio);

  const avatarFile = $("modalAvatarInput").files[0];
  const coverFile = $("modalCoverInput").files[0];

  const readFile = (file) => new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => res(e.target.result);
    reader.readAsDataURL(file);
  });

  if(avatarFile){
    const avatarData = await readFile(avatarFile);
    localStorage.setItem("zcrushProfilePhoto", avatarData);
  }

  if(coverFile){
    const coverData = await readFile(coverFile);
    localStorage.setItem("zcrushCoverPhoto", coverData);
  }

  loadProfile();
  closeEditModal();
  showToast("Profile updated successfully!");
}

function renderMyPostTab(){
  const posts = JSON.parse(localStorage.getItem("zcrushPosts") || "[]");
  const shorts = JSON.parse(localStorage.getItem("zcrushShorts") || "[]");
  const handle = localStorage.getItem("zcrushUserHandle") || "@zcrushuser";
  const name = localStorage.getItem("zcrushUserName") || "ZCrush User";

  const userPosts = posts.filter(p => p.handle === handle || p.owner === handle);
  const userShorts = shorts.filter(s => s.username === name);

  $("postCount").textContent = userPosts.length + userShorts.length;

  const grid = $("contentGrid");
  grid.innerHTML = "";

  if(userPosts.length === 0 && userShorts.length === 0){
    grid.innerHTML = `<div class="empty-msg">No posts or shorts shared yet.</div>`;
    return;
  }

  userShorts.forEach(short => {
    const item = document.createElement("div");
    item.className = "grid-item";
    item.innerHTML = `
      <video src="${short.video}"></video>
      <div class="view-badge">▶ ${short.views || 0} views</div>
    `;
    grid.appendChild(item);
  });

  userPosts.forEach(post => {
    const item = document.createElement("div");
    item.className = "grid-item";
    if(post.image){
      item.innerHTML = `<img src="${post.image}" alt="Post">`;
    }else if(post.video){
      item.innerHTML = `<video src="${post.video}"></video>`;
    }else{
      item.innerHTML = `<div class="grid-text">${post.text || "Text Post"}</div>`;
    }
    grid.appendChild(item);
  });
}

function renderShortTab(){
  const shorts = JSON.parse(localStorage.getItem("zcrushShorts") || "[]");
  const name = localStorage.getItem("zcrushUserName") || "ZCrush User";
  const userShorts = shorts.filter(s => s.username === name);

  const grid = $("contentGrid");
  grid.innerHTML = "";

  if(userShorts.length === 0){
    grid.innerHTML = `<div class="empty-msg">No shorts available.</div>`;
    return;
  }

  userShorts.forEach(short => {
    const item = document.createElement("div");
    item.className = "grid-item";
    item.innerHTML = `
      <video src="${short.video}"></video>
      <div class="view-badge">▶ ${short.views || 0} views</div>
    `;
    grid.appendChild(item);
  });
}

function switchTab(type, btn){
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  if(type === "posts"){
    renderMyPostTab();
  }else if(type === "shorts"){
    renderShortTab();
  }
}

/* AUTOMATIC DEVICE THEME */
const deviceTheme = window.matchMedia("(prefers-color-scheme: dark)");
function applyDeviceTheme(){
  document.body.classList.toggle("light", !deviceTheme.matches);
}
applyDeviceTheme();
if(deviceTheme.addEventListener){
  deviceTheme.addEventListener("change", applyDeviceTheme);
}

loadProfile();
if(window.lucide) lucide.createIcons();
</script>
</body>
</html>
