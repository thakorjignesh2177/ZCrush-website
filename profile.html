<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZCrush - Profile</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#151827;
}

/* TOPBAR */

.topbar{
  height:65px;
  background:white;
  border-bottom:1px solid #e5e7ef;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:25px;
  font-weight:bold;
  background:linear-gradient(90deg,#9b00ff,#ff22bd,#168cff);
  -webkit-background-clip:text;
  color:transparent;
}

.search{
  width:280px;
  background:#f1f3f8;
  border:none;
  outline:none;
  padding:11px 16px;
  border-radius:22px;
}

.topRight{
  display:flex;
  align-items:center;
  gap:18px;
}

.icon{
  font-size:20px;
  cursor:pointer;
}

.topAvatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

/* LAYOUT */

.layout{
  display:flex;
  max-width:1250px;
  margin:auto;
}

/* SIDEBAR */

.sidebar{
  width:220px;
  min-height:calc(100vh - 65px);
  background:white;
  border-right:1px solid #e5e7ef;
  padding:25px 15px;
  position:sticky;
  top:65px;
  height:calc(100vh - 65px);
}

.sidebar a{
  display:block;
  text-decoration:none;
  color:#555b6d;
  padding:13px 15px;
  border-radius:10px;
  margin-bottom:6px;
  font-size:14px;
}

.sidebar a:hover,
.sidebar a.active{
  background:#f0e8ff;
  color:#781cff;
  font-weight:bold;
}

/* MAIN */

.main{
  flex:1;
  padding:25px;
  max-width:1000px;
}

/* COVER */

.cover{
  height:250px;
  border-radius:18px;
  background:
    linear-gradient(
      rgba(0,0,0,.15),
      rgba(0,0,0,.25)
    ),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1500&q=80")
    center/cover;
  position:relative;
}

/* PROFILE CARD */

.profileCard{
  background:white;
  border-radius:18px;
  margin-top:-70px;
  position:relative;
  padding:0 25px 25px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.profileTop{
  display:flex;
  align-items:flex-end;
  gap:20px;
}

.profilePhoto{
  width:130px;
  height:130px;
  border-radius:50%;
  border:5px solid white;
  object-fit:cover;
  background:#e9ebf2;
  margin-top:-60px;
}

.profileInfo{
  padding-top:15px;
  flex:1;
}

.profileName{
  font-size:25px;
  font-weight:bold;
}

.verified{
  color:#258cff;
}

.handle{
  color:#777;
  margin-top:5px;
}

.bio{
  margin-top:10px;
  color:#555;
  line-height:1.5;
}

.profileActions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#721cff;
  color:white;
}

.secondary{
  background:#f0f1f6;
  color:#333;
}

.stats{
  display:flex;
  gap:35px;
  margin-top:22px;
  border-top:1px solid #eee;
  padding-top:18px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#777;
  font-size:13px;
}

/* TABS */

.tabs{
  display:flex;
  gap:30px;
  background:white;
  margin-top:20px;
  padding:0 20px;
  border-radius:15px;
  border:1px solid #e5e7ef;
}

.tab{
  padding:17px 5px;
  cursor:pointer;
  color:#777;
  border-bottom:3px solid transparent;
}

.tab.active{
  color:#721cff;
  border-color:#721cff;
  font-weight:bold;
}

/* CONTENT */

.contentBox{
  margin-top:20px;
}

.tabContent{
  display:none;
}

.tabContent.active{
  display:block;
}

/* POSTS */

.postsGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.postCard{
  background:white;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #e5e7ef;
}

.postCard img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

.postText{
  padding:14px;
  font-size:14px;
  line-height:1.5;
}

.postBottom{
  padding:0 14px 14px;
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:13px;
}

.deletePost{
  color:#ef4056;
  cursor:pointer;
}

/* EMPTY */

.empty{
  background:white;
  border:1px solid #e5e7ef;
  border-radius:15px;
  padding:45px 20px;
  text-align:center;
  color:#777;
}

.empty h3{
  color:#333;
  margin-bottom:8px;
}

/* ABOUT */

.aboutBox{
  background:white;
  border:1px solid #e5e7ef;
  border-radius:15px;
  padding:20px;
}

.aboutRow{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.aboutRow:last-child{
  border-bottom:none;
}

.aboutLabel{
  color:#777;
  font-size:13px;
}

.aboutValue{
  margin-top:4px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:5000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalBox{
  width:100%;
  max-width:500px;
  background:white;
  border-radius:18px;
  padding:25px;
}

.modalBox h2{
  margin-bottom:20px;
}

.inputGroup{
  margin-bottom:15px;
}

.inputGroup label{
  display:block;
  font-size:13px;
  color:#666;
  margin-bottom:6px;
}

.inputGroup input,
.inputGroup textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.inputGroup textarea{
  min-height:90px;
  resize:none;
}

.modalButtons{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:20px;
}

/* RESPONSIVE */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .main{
    padding:15px;
  }

  .search{
    display:none;
  }

  .profileTop{
    align-items:center;
    flex-direction:column;
    text-align:center;
  }

  .profileInfo{
    width:100%;
  }

  .profilePhoto{
    margin-top:-65px;
  }

  .profileActions{
    justify-content:center;
  }

  .stats{
    justify-content:center;
  }

  .postsGrid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .postsGrid{
    grid-template-columns:1fr;
  }

  .cover{
    height:190px;
  }

  .profileName{
    font-size:22px;
  }

  .tabs{
    gap:18px;
    overflow-x:auto;
  }

}

</style>
</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

  <div class="logo">ZCrush</div>

  <input
    class="search"
    placeholder="Search ZCrush"
  >

  <div class="topRight">

    <span class="icon">🔔</span>

    <img
      id="topAvatar"
      class="topAvatar"
      src=""
    >

  </div>

</header>


<div class="layout">

<!-- SIDEBAR -->

<aside class="sidebar">

  <a href="index.html">🏠 Home</a>

  <a href="social.html">👥 Social</a>
  
  <a href="moments.html">⭐ Moments</a>

  <a href="gaming.html">🎮 Gaming</a>

  <a href="shorts.html">🎬 Shorts</a>

  <a href="marketplace.html">🛒 Marketplace</a>

  <a href="profile.html" class="active">
    👤 Profile
  </a>

</aside>


<!-- MAIN -->

<main class="main">

  <!-- COVER -->

  <div class="cover" id="coverPhoto"></div>


  <!-- PROFILE -->

  <section class="profileCard">

    <div class="profileTop">

      <img
        id="profilePhoto"
        class="profilePhoto"
        src=""
      >

      <div class="profileInfo">

        <div class="profileName">

          <span id="profileName">
            ZCrush User
          </span>

          <span class="verified">✓</span>

        </div>

        <div
          class="handle"
          id="profileHandle"
        >
          @zcrushuser
        </div>

        <div
          class="bio"
          id="profileBio"
        >
          Dream • Create • Explore 🚀
          <br>
          Gaming | Tech | Animation | More...
        </div>

      </div>

    </div>


    <!-- ACTIONS -->

    <div class="profileActions">

      <button
        class="btn primary"
        onclick="openEdit()"
      >
        Edit Profile
      </button>

      <button
        class="btn secondary"
        onclick="shareProfile()"
      >
        Share Profile
      </button>
      <button
        class="btn secondary"
        onclick="logoutUser()"
      >
        🚪 Logout
      </button>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <strong id="postCount">0</strong>
        <span>Posts</span>
      </div>

      <div class="stat">
        <strong id="followerCount">0</strong>
        <span>Followers</span>
      </div>

      <div class="stat">
        <strong id="followingCount">0</strong>
        <span>Following</span>
      </div>

    </div>

  </section>


  <!-- TABS -->

  <div class="tabs">

    <div
      class="tab active"
      onclick="showTab('posts',this)"
    >
      Posts
    </div>

    <div
      class="tab"
      onclick="showTab('about',this)"
    >
      About
    </div>

  </div>


  <div class="contentBox">

    <!-- POSTS TAB -->

    <section
      id="posts"
      class="tabContent active"
    >

      <div
        id="postsGrid"
        class="postsGrid"
      ></div>

    </section>


    <!-- ABOUT TAB -->

    <section
      id="about"
      class="tabContent"
    >

      <div class="aboutBox">

        <div class="aboutRow">

          <div class="aboutLabel">
            Name
          </div>

          <div
            class="aboutValue"
            id="aboutName"
          >
          </div>

        </div>


        <div class="aboutRow">

          <div class="aboutLabel">
            Username
          </div>

          <div
            class="aboutValue"
            id="aboutHandle"
          >
          </div>

        </div>


        <div class="aboutRow">

          <div class="aboutLabel">
            Bio
          </div>

          <div
            class="aboutValue"
            id="aboutBio"
          >
          </div>

        </div>

      </div>

    </section>

  </div>

</main>

</div>


<!-- EDIT MODAL -->

<div
  class="modal"
  id="editModal"
>

  <div class="modalBox">

    <h2>Edit Profile</h2>


    <div class="inputGroup">

      <label>Name</label>

      <input
        id="editName"
        type="text"
      >

    </div>


    <div class="inputGroup">

      <label>Username / Handle</label>

      <input
        id="editHandle"
        type="text"
        placeholder="@username"
      >

    </div>


    <div class="inputGroup">

      <label>Bio</label>

      <textarea
        id="editBio"
      ></textarea>

    </div>


    <div class="inputGroup">

      <label>Profile Photo</label>

      <input
        id="profilePhotoInput"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="inputGroup">

      <label>Cover Photo</label>

      <input
        id="coverPhotoInput"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="modalButtons">

      <button
        class="btn secondary"
        onclick="closeEdit()"
      >
        Cancel
      </button>

      <button
        class="btn primary"
        onclick="saveProfile()"
      >
        Save Changes
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   LOGIN PROTECTION
========================= */

if(
  localStorage.getItem("zcrushLoggedIn")
  !== "true"
){

  alert("Please login first.");

  window.location.href="login.html";

}


/* =========================
   HELPERS
========================= */

function escapeHTML(str){

  if(str===undefined || str===null)
    return "";

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD PROFILE
========================= */

function loadUserProfile(){

  const name=
    localStorage.getItem("zcrushUserName")
    || "ZCrush User";

  const handle=
    localStorage.getItem("zcrushUserHandle")
    || "@zcrushuser";

  const bio=
    localStorage.getItem("zcrushUserBio")
    ||
    "Dream • Create • Explore 🚀\nGaming | Tech | Animation | More...";

  const photo=
    localStorage.getItem("zcrushProfilePhoto")
    || "";

  const cover=
    localStorage.getItem("zcrushCoverPhoto")
    || "";


  document.getElementById("profileName")
    .textContent=name;

  document.getElementById("profileHandle")
    .textContent=handle;

  document.getElementById("profileBio")
    .innerHTML=
      escapeHTML(bio).replace(/\n/g,"<br>");


  document.getElementById("aboutName")
    .textContent=name;

  document.getElementById("aboutHandle")
    .textContent=handle;

  document.getElementById("aboutBio")
    .textContent=bio;


  const profilePhoto=
    document.getElementById("profilePhoto");

  const topAvatar=
    document.getElementById("topAvatar");


  if(photo){

    profilePhoto.src=photo;
    topAvatar.src=photo;

  }else{

    profilePhoto.src=
      "https://via.placeholder.com/200/721cff/ffffff?text=Z";

    topAvatar.src=
      "https://via.placeholder.com/100/721cff/ffffff?text=Z";

  }


  if(cover){

    document.getElementById("coverPhoto")
      .style.backgroundImage=
      `url("${cover}")`;

  }


  loadSocialPosts();

}


/* =========================
   GET SOCIAL POSTS
========================= */

function getPosts(){

  try{

    const posts=
      JSON.parse(
        localStorage.getItem("zcrushPosts")
        || "[]"
      );

    return Array.isArray(posts)
      ? posts
      : [];

  }catch(e){

    return [];

  }

}


/* =========================
   LOAD SOCIAL POSTS
========================= */

function loadSocialPosts(){

  const posts=getPosts();

  const currentHandle=
    localStorage.getItem("zcrushUserHandle")
    || "@zcrushuser";

  const currentName=
    localStorage.getItem("zcrushUserName")
    || "ZCrush User";


  /*
    Only show posts belonging
    to current user
  */

  const myPosts=posts.filter(function(post){

    return (
      post.owner===currentHandle
      ||
      post.handle===currentHandle
      ||
      (
        !post.owner &&
        post.name===currentName
      )
    );

  });


  /* POSTS COUNT */

  document.getElementById("postCount")
    .textContent=myPosts.length;


  /* FOLLOWING COUNT */

  let following=[];

  try{

    following=
      JSON.parse(
        localStorage.getItem("zcrushFollowing")
        || "[]"
      );

  }catch(e){

    following=[];

  }

  document.getElementById("followingCount")
    .textContent=following.length;


  /* FOLLOWER COUNT */

  /*
    Real follower count will be connected
    when cloud database is added.
  */

  document.getElementById("followerCount")
    .textContent="0";


  renderProfilePosts(myPosts);

}


/* =========================
   RENDER PROFILE POSTS
========================= */

function renderProfilePosts(posts){

  const grid=
    document.getElementById("postsGrid");


  if(posts.length===0){

    grid.innerHTML=`

      <div
        class="empty"
        style="grid-column:1/-1;"
      >

        <h3>No posts yet</h3>

        <p>
          Create your first post on ZCrush Social.
        </p>

        <br>

        <button
          class="btn primary"
          onclick="window.location.href='social.html'"
        >
          Create Post
        </button>

      </div>

    `;

    return;

  }


  grid.innerHTML=
    posts.map(function(post){

      return `

        <div class="postCard">

          ${
            post.image
            ? `
              <img
                src="${escapeHTML(post.image)}"
                alt="Post"
              >
            `
            : `
              <div
                style="
                  height:220px;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  padding:20px;
                  background:#f0f1f6;
                  color:#555;
                  text-align:center;
                "
              >
                ${escapeHTML(post.text || "Post")}
              </div>
            `
          }


          ${
            post.text
            ? `
              <div class="postText">
                ${escapeHTML(post.text)}
              </div>
            `
            : ""
          }


          <div class="postBottom">

            <span>
              ❤️ ${post.likes || 0}
            </span>

            <span
              class="deletePost"
              onclick="deleteProfilePost('${escapeAttribute(post.id)}')"
            >
              Delete
            </span>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   DELETE POST
========================= */

function deleteProfilePost(id){

  if(!confirm("Delete this post?")){
    return;
  }


  let posts=getPosts();


  posts=
    posts.filter(function(post){

      return String(post.id)!==
        String(id);

    });


  localStorage.setItem(
    "zcrushPosts",
    JSON.stringify(posts)
  );


  loadSocialPosts();

}


/* =========================
   EDIT PROFILE
========================= */

function openEdit(){

  document.getElementById("editName").value=
    localStorage.getItem("zcrushUserName")
    || "ZCrush User";


  document.getElementById("editHandle").value=
    localStorage.getItem("zcrushUserHandle")
    || "@zcrushuser";


  document.getElementById("editBio").value=
    localStorage.getItem("zcrushUserBio")
    ||
    "Dream • Create • Explore 🚀\nGaming | Tech | Animation | More...";


  document.getElementById("editModal")
    .style.display="flex";

}


function closeEdit(){

  document.getElementById("editModal")
    .style.display="none";

}


/* =========================
   SAVE PROFILE
========================= */

function saveProfile(){

  let name=
    document.getElementById("editName")
    .value.trim();

  let handle=
    document.getElementById("editHandle")
    .value.trim();

  const bio=
    document.getElementById("editBio")
    .value.trim();


  if(!name){

    alert("Please enter your name.");
    return;

  }


  if(!handle){

    handle="@zcrushuser";

  }


  if(!handle.startsWith("@")){

    handle="@"+handle;

  }


  /*
    IMPORTANT:
    Save new profile data.
  */

  localStorage.setItem(
    "zcrushUserName",
    name
  );

  localStorage.setItem(
    "zcrushUserHandle",
    handle
  );

  localStorage.setItem(
    "zcrushUserBio",
    bio
  );


  /* PROFILE PHOTO */

  const photoFile=
    document.getElementById("profilePhotoInput")
    .files[0];


  if(photoFile){

    const reader=
      new FileReader();

    reader.onload=function(e){

      localStorage.setItem(
        "zcrushProfilePhoto",
        e.target.result
      );

      saveCoverAndFinish();

    };

    reader.readAsDataURL(photoFile);

  }else{

    saveCoverAndFinish();

  }

}


/* =========================
   COVER PHOTO
========================= */

function saveCoverAndFinish(){

  const coverFile=
    document.getElementById("coverPhotoInput")
    .files[0];


  if(coverFile){

    const reader=
      new FileReader();

    reader.onload=function(e){

      localStorage.setItem(
        "zcrushCoverPhoto",
        e.target.result
      );

      finishProfileSave();

    };

    reader.readAsDataURL(coverFile);

  }else{

    finishProfileSave();

  }

}


/* =========================
   FINISH SAVE
========================= */

function finishProfileSave(){

  closeEdit();

  loadUserProfile();

  alert("Profile updated successfully! ✓");

}


/* =========================
   SHARE PROFILE
========================= */

async function shareProfile(){

  const handle=
    localStorage.getItem("zcrushUserHandle")
    || "@zcrushuser";

  const text=
    "Check out "+handle+" on ZCrush!";


  try{

    if(navigator.share){

      await navigator.share({

        title:"ZCrush Profile",

        text:text,

        url:window.location.href

      });

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert("Profile link copied!");

    }

  }catch(e){}

}


/* =========================
   TABS
========================= */

function showTab(tabName,element){

  document
    .querySelectorAll(".tabContent")
    .forEach(function(tab){

      tab.classList.remove("active");

    });


  document
    .querySelectorAll(".tab")
    .forEach(function(tab){

      tab.classList.remove("active");

    });


  document
    .getElementById(tabName)
    .classList.add("active");


  element.classList.add("active");

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeAttribute(str){

  return String(str)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


/* =========================
   START
========================= */

loadUserProfile();
function logoutUser(){

  const confirmLogout =
    confirm("Are you sure you want to logout?");

  if(!confirmLogout){
    return;
  }

  localStorage.removeItem("zcrushLoggedIn");

  window.location.href = "login.html";
}

</script>

</body>
</html>
