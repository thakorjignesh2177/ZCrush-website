<script>

  /* ==========================================
     LOAD USER DATA FROM SIGN UP
  ========================================== */

  function loadUserProfile() {

    const savedName =
      localStorage.getItem("zcrushUserName");

    let savedHandle =
      localStorage.getItem("zcrushUserHandle");


    /* NAME */

    if (savedName && savedName.trim() !== "") {

      document.getElementById("profileName").innerHTML =
        escapeHTML(savedName.trim()) +
        ' <span class="verified">✔</span>';

    }


    /* USERNAME / HANDLE */

    if (savedHandle && savedHandle.trim() !== "") {

      savedHandle = savedHandle.trim();

      if (!savedHandle.startsWith("@")) {
        savedHandle = "@" + savedHandle;
      }

      document.getElementById("profileHandle").textContent =
        savedHandle;

    }


    /* PROFILE PHOTO + TOP AVATAR */

    if (savedName && savedName.trim() !== "") {

      const firstLetter =
        savedName.trim().charAt(0).toUpperCase();

      document.getElementById("profilePhoto").textContent =
        firstLetter;

      document.getElementById("topAvatar").textContent =
        firstLetter;

    }

  }


  /* ==========================================
     OPEN EDIT PROFILE
  ========================================== */

  function openEdit() {

    const name =
      localStorage.getItem("zcrushUserName") ||
      "ZCrush User";

    const handle =
      localStorage.getItem("zcrushUserHandle") ||
      "@zcrushuser";

    const bio =
      localStorage.getItem("zcrushUserBio") ||
      "Welcome to ZCrush 🚀 Connect, create, watch, shop and play — all in one place.";


    document.getElementById("editName").value =
      name;

    document.getElementById("editHandle").value =
      handle;

    document.getElementById("editBio").value =
      bio;


    document.getElementById("editModal").style.display =
      "flex";

  }


  /* ==========================================
     CLOSE EDIT PROFILE
  ========================================== */

  function closeEdit() {

    document.getElementById("editModal").style.display =
      "none";

  }


  /* ==========================================
     SAVE PROFILE
  ========================================== */

  function saveProfile() {

    let name =
      document.getElementById("editName").value.trim();

    let handle =
      document.getElementById("editHandle").value.trim();

    let bio =
      document.getElementById("editBio").value.trim();


    if (name === "") {

      alert("Please enter your name.");

      return;

    }


    if (handle === "") {

      alert("Please enter your username.");

      return;

    }


    /* Remove spaces */

    handle =
      handle.replace(/\s+/g, "");


    /* Remove existing @ */

    handle =
      handle.replace(/^@+/, "");


    /* Add @ */

    handle =
      "@" + handle;


    /* SAVE USER DATA */

    localStorage.setItem(
      "zcrushUserName",
      name
    );

    localStorage.setItem(
      "zcrushUserHandle",
      handle
    );

    localStorage.setItem(
      "zcrushUserBio",
      bio
    );


    /* UPDATE PROFILE */

    document.getElementById("profileName").innerHTML =
      escapeHTML(name) +
      ' <span class="verified">✔</span>';


    document.getElementById("profileHandle").textContent =
      handle;


    document.getElementById("profileBio").textContent =
      bio ||
      "Welcome to ZCrush 🚀 Connect, create, watch, shop and play — all in one place.";


    /* UPDATE AVATAR */

    const firstLetter =
      name.charAt(0).toUpperCase();

    document.getElementById("profilePhoto").textContent =
      firstLetter;

    document.getElementById("topAvatar").textContent =
      firstLetter;


    closeEdit();

    alert("Profile updated successfully! ✅");

  }


  /* ==========================================
     SHARE PROFILE
  ========================================== */

  function shareProfile() {

    const name =
      localStorage.getItem("zcrushUserName") ||
      "ZCrush User";

    const handle =
      localStorage.getItem("zcrushUserHandle") ||
      "@zcrushuser";


    const shareText =
      "Check out " +
      name +
      " (" +
      handle +
      ") on ZCrush 🚀";


    if (navigator.share) {

      navigator.share({

        title: "ZCrush Profile",

        text: shareText,

        url: window.location.href

      });

    } else {

      navigator.clipboard.writeText(
        window.location.href
      );

      alert("Profile link copied! 🔗");

    }

  }


  /* ==========================================
     HTML ESCAPE
  ========================================== */

  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================
     CLOSE MODAL OUTSIDE CLICK
  ========================================== */

  document.getElementById("editModal")
    .addEventListener("click", function(event) {

      if (event.target === this) {

        closeEdit();

      }

    });


  /* ==========================================
     LOAD PROFILE
  ========================================== */

  window.addEventListener(
    "DOMContentLoaded",
    loadUserProfile
  );

</script>
